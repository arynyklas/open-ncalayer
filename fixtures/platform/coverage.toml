[[defect]]
id = "D2"
title = "oncl sign --profile xml --add over a whole-document signature fails only after the key was used"
reproduction = "oncl sign --profile xml --input doc.xml --output f.xml ...; oncl sign --profile xml --add --input f.xml --output t.xml ... (same key, strict loopback PKI)"
observed = "exit 1, `oncl: InvalidInput; applied=Applied`: the private key signed, nothing was published. The refusal (a whole-document reference cannot survive an Add: oncl-xml sign.rs doc comment) depends only on the existing signature's reference and could precede the key use"
expected = "(desired grade after the fix of D5; the row fails until then)"

[[defect]]
id = "D3"
title = "oncl refuses NCANode's GOST XAdES (InvalidInput), RSA XAdES verifies"
reproduction = "oncl verify --profile xades-b|xades-t|xades-lt|xades-lta (also xml, xml-kalkan) --input target/fixtures/ncanode/xades-test-signed-b.xml (any level of that fixture) or NCANode /xml/sign with xadesLevel B and a GOST 2015 or GOST 2004 test key; deleting the ds:Object makes the `xml` profile accept the structure"
observed = "exit 1, `oncl: InvalidInput; applied=NotApplied`, no report. The same request with the RSA test key verifies (signature Passed, level B/T)"
expected = "(desired grade after the fix of D5; the row fails until then)"

[[defect]]
id = "D4"
title = "oncl sign --profile xades-lt: NCANode reads our XAdES-LT as T"
reproduction = "oncl sign --profile xades-lt --tsa-url ... --tsa-policy 1.2.398.3.3.2.6.2 --signature-id sig-1 (any key), then NCANode POST /xml/verify of the result"
observed = "oncl reports level Lt; NCANode adesLevel T. The document carries 1 signature timestamp and 2 OCSP values but no CertificateValues (certs=0); the same document extended with `oncl extend --profile xml --level lt` and --evidence-certificate (certs=2, ocsp=4) is read as LT by NCANode"
expected = "(desired grade after the fix of D5; the row fails until then)"

[[defect]]
id = "D5"
title = "oncl verify --profile pades-* reports Signature(Malformed) for Kalkan's PAdES"
reproduction = "oncl verify --profile pades-b --input target/fixtures/ncanode/sample-signed-b.pdf (or any PDF from NCANode /pdf/sign); compare --profile pdf and the independent decomposition (oracle.py pdf-byterange: ByteRange digest and, for RSA, the signature value verify; pyHanko: intact and valid)"
observed = "signature=Failed, reasons include Signature(Malformed) under pades-*; under `pdf` the same file gives signature=Passed. The CMS is ETSI.CAdES.detached with signed attributes contentType, signingTime, signingCertificateV2, messageDigest (no CMSAlgorithmProtection)"
expected = "(desired grade after the fix of D5; the row fails until then)"

