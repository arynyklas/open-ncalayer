# The matrix of `cargo xtask platform-interop` (docs/dev/platform-interop.md).
#
# capability -> cases -> oracle descriptors -> expected grade. A test fails when a route of
# the pinned OpenAPI has no capability, a capability has no case, a case has no row here, a
# row has no case, an oracle has no descriptor. The run fails a row whose observed grade is
# not exactly `expected`.
#
# The grade of a case lists one `key=value` per judge. `crypto=ok` means every judge that
# can check the signature value and the digests accepted them; `crypto=failure` is a
# counterexample (signed data or the signature altered) that every judge rejected. The
# certificate grade is separate and never stands for the cryptographic one: `ours=Valid`
# is the verdict of a strict run against the loopback PKI, `ncanode=INDETERMINATE/...` the
# grade of NCANode, whose world does not know our roots (synthetic keys) or whose test
# certificates have expired.
#
# Limitations of the oracles that are recorded, not adopted as desired behaviour:
#   * NCANode's /xml/verify does not register `Id` attributes (an internal DTD subset that
#     declares them is added to documents it verifies) and grades only the first signature;
#   * NCANode's /x509/verify and /pkcs12/info return `valid` over the certificate chain too:
#     with expired test certificates and unknown synthetic roots it is always false, so it
#     cannot tell a good raw signature from a bad one;
#   * NCANode's expired test PKI: every NCANode key grades OUT_OF_BOUNDS_NO_POE.

schema = 1

[pins]
ncanode_commit = "0adab29a7d30c181d70e8cc6b4f243122f50c3b8"
ncanode_image = "malikzh/ncanode@sha256:052222f30ac73d9f0060a5c80c572723d25dd84e21073435795a10db254c02b8"
openapi_sha256 = "43fcf7bf3a46ca47bdaf38c73f7b5af588654ae016baf7f5f0a42c90bc95ee3c"
openapi_routes = [
  "/cms/extend", "/cms/extract", "/cms/sign", "/cms/sign/add", "/cms/verify",
  "/jws/sign", "/jws/sign/add", "/jws/verify",
  "/jwt/decode", "/jwt/encode",
  "/pdf/extend", "/pdf/sign", "/pdf/verify",
  "/pkcs12/aliases", "/pkcs12/info",
  "/wsse/sign", "/wsse/verify",
  "/x509/info", "/x509/sign", "/x509/verify",
  "/xml/sign", "/xml/verify",
]

# ---- oracle descriptors ---------------------------------------------------------------

[[oracle]]
id = "ncanode"
tool = "NCANode (Kalkan)"
version = "3.5.1"
match_version = "exact"
pin = "malikzh/ncanode@sha256:052222f30ac73d9f0060a5c80c572723d25dd84e21073435795a10db254c02b8 (commit 0adab29a7d30c181d70e8cc6b4f243122f50c3b8)"
role = "independent GOST 2004/2015-512 and RSA implementation of CMS/CAdES, XMLDSig/XAdES, WS-Security, PAdES, JWS/JWT, X.509 and PKCS#12; the only GOST math oracle"

[[oracle]]
id = "openssl"
tool = "OpenSSL"
version = "3."
match_version = "prefix"
role = "RSA CMS/CAdES verification with full path validation, raw signatures, X.509 and PKCS#12 reading, RFC 3161 token verification"

[[oracle]]
id = "pyhanko"
tool = "pyHanko"
version = "0.38.0"
match_version = "exact"
pin = "with pyhanko-certvalidator 0.33.0"
role = "PAdES/CAdES validation (integrity, DSS contents, document timestamps, revocation from DSS)"

[[oracle]]
id = "lxml"
tool = "lxml (libxml2 canonicalization)"
version = "6.1.3"
match_version = "exact"
role = "Canonical XML for XMLDSig/XAdES/WS-Security references and SignedInfo"

[[oracle]]
id = "cryptography"
tool = "cryptography (pyca)"
version = "50.0.2"
match_version = "exact"
role = "RSA PKCS#1 v1.5 verification of CMS signed attributes, SignedInfo, JWS and timestamp tokens"

[[oracle]]
id = "asn1crypto"
tool = "asn1crypto"
version = "1.5.1"
match_version = "exact"
role = "independent BER/DER reader of CMS, RFC 3161 tokens and certificates"

