[[case]]
id = "pdf-sign-rsa"
capability = "pdf.sign"
profile = "rsa"
oracles = ["ncanode", "pyhanko", "asn1crypto", "cryptography"]
what = "oncl signs sample.pdf (adbe.pkcs7.detached) with rsa; NCANode, the ByteRange decomposition (hashlib over the ranges + CMS) and (RSA) pyHanko verify"
expected = "crypto=ok ours=Valid/level=none ncanode=INDETERMINATE/CHAIN_INCOMPLETE/level=B byterange=1x digest=ok subfilter=adbe.pkcs7.detached pyhanko=trusted dss=false doc-timestamps=0"

[[case]]
id = "pdf-tamper-rsa"
capability = "pdf.verify"
profile = "rsa"
oracles = ["ncanode", "pyhanko", "asn1crypto", "cryptography"]
what = "one byte of the signed ByteRange altered in our rsa PDF: every judge must reject"
expected = "crypto=failure ours=Invalid/Failed ncanode=VerifyError/content-hash-differs byterange=digest-mismatch pyhanko=not-intact"

