capability = "cms.sign"
profile = "rsa"
oracles = ["ncanode", "openssl", "cryptography", "asn1crypto"]
what = "oncl signs attached; NCANode, OpenSSL (full path) and pyca/asn1crypto verify"
expected = "crypto=ok ours=Valid ncanode=INDETERMINATE/CHAIN_INCOMPLETE openssl=verified python-rsa=ok"

