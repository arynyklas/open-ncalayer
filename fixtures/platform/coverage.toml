[[defect]]
id = "D1"
title = "oncl refuses every CAdES-LT NCANode makes: MemoryLimit"
reproduction = "NCANode `POST /cms/sign` with cadesLevel LT (withTsp true, any test key) or `POST /cms/extend` to LT of our CAdES-B; then `oncl verify --profile cades-lt --input <that CMS>` (also `--profile cms`, `cades-b`, `oncl inspect --profile cms`) with or without --offline / --configuration-bytes"
observed = "exit 1, `oncl: MemoryLimit; applied=NotApplied`, no report. The CMS is 20.45 MB: Kalkan embeds the complete NCA CRL (20.45 MB) in the LT; the default metadata quota (oncl-pki ResourceLimits.metadata_bytes = 64 MiB, the container is charged a multiple of its size) does not admit it and the CLI has no option to raise it"
expected = "signature Passed (NCANode, pyca/asn1crypto and OpenSSL agree the signature value and digests are valid), certificate/chain/timestamp graded by the host trust: the same report shape as for the CAdES-T of the same key"

