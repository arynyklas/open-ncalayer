capability = "xml.verify"
profile = "gost2004"
oracles = ["ncanode"]
what = "NCANode (Kalkan) signs the document with its gost2004 test key; oncl verifies it under the `xml` and `xml-kalkan` profiles"
expected = "crypto=ok ours=xml:Invalid/sig=Passed/chain=Failed/validity=Failed xml-kalkan:Invalid/sig=Passed/chain=Failed/validity=Failed ncanode=INDETERMINATE/OUT_OF_BOUNDS_NO_POE"

