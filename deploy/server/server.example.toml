# oncl-server: example configuration. Every value below is the product default or a
# placeholder; nothing here opens a socket. The HTTP API is OFF: `enabled = false`, and
# `oncl-server serve` then prints "disabled: no listener" and exits without touching the
# audit journal, a key, a TLS file or the network.
#
# To use it: copy this file to the private operator directory (an owner-only directory;
# see docs/server.md, "Private operator namespace and tokens"), edit the paths, create a
# token (`oncl-server token-create`), add it under [[tokens]] and ENABLE the API
# explicitly: set `enabled = true` here, or start with `oncl-server serve --config <file>
# --enable-api`. Paths below are for a Linux service account; use absolute paths.
#
# No secret belongs in this file: a token appears only as its verifier (a hash), keys and
# passwords only as references to files in a private directory.

enabled = false

# Loopback only unless an `exposure` is configured (below). A non-loopback bind also
# needs `hosts`, the exact HTTP authorities clients use.
bind = "127.0.0.1:13579"

# The durable audit journal. The server creates this private directory at its first start
# (do not create it yourself). Every private key use is recorded here BEFORE the key is
# applied; a failure to record refuses the operation. A journal that already exists is
# reopened only with `recover_audit = true` (measured: after a clean stop, a restart with
# `false` is refused). Recovery rejects a corrupt or foreign journal and never repairs
# one silently, so a service that restarts keeps `true` once the API is enabled.
audit_directory = "/var/lib/oncl-server/audit"
recover_audit = false

# Transient public-document snapshots (multipart uploads), created by the server as a
# private directory if absent. Bounded by `temp_*` below; secrets from requests never go
# there.
scratch_directory = "/var/lib/oncl-server/scratch"

# Budgets. `total_memory` is the sum of the working memory of all admitted operations
# (not the process RSS: the HTTP stack, runtime threads and framing are extra, so keep
# the container/systemd memory limit about twice `total_memory`). The temp limits bound
# the scratch directory: size its filesystem to `total_temp` or lower these values.
#
# Concurrency. Receiving a request body is a phase of its own: at most `max_uploads` bodies
# are received at once (default 8, 1..256, and at most
# `total_temp / (input_bytes + container_bytes)`, which the server checks at start: every upload
# must be able to reserve its largest spool). A receiving request takes neither a
# `max_in_flight` slot nor a native worker, so a client that stalls mid-body holds one upload
# slot only. A request that finds every upload slot taken waits up to `admission_wait_ms` for
# one and only then gets the typed `CapacityExceeded` refusal, before its body is read.
# `max_in_flight` operations run at once: a request whose body is in waits up to
# `admission_wait_ms` for a slot (an admitted operation waits as long for a native worker) and
# only then gets the typed `CapacityExceeded` refusal. Each operation has one
# `operation_timeout_ms` deadline, counted from its admission to the upload phase (so it
# also covers the upload).
#
# Uploads. A client that stops sending must not keep its upload slot and spool for the whole
# operation timeout: a body that delivers no byte for `upload_idle_timeout_ms` is ended with
# `DeadlineExceeded`/`NotApplied`. A client that sends one byte per idle period is caught by
# the minimum rate: over every idle-timeout window of waiting for the client, at least
# `upload_min_bytes_per_second` bytes must arrive (0 = idle timeout only). Only time spent
# waiting for the client counts, never time spent hashing or queueing. Both defaults are far
# below any real network (30 s of silence, 1 KiB/s); the operation timeout still bounds a
# legitimate transfer, so raise it (not these) for a very large upload over a slow link.
max_in_flight = 2
max_uploads = 8
blocking_workers = 2
queue_capacity = 2
admission_wait_ms = 1000
operation_timeout_ms = 300000
upload_idle_timeout_ms = 30000
upload_min_bytes_per_second = 1024
max_connections = 32
header_timeout_ms = 5000
input_bytes = 1073741824
# Signature, revision or envelope bytes a signed result may add to a document that is at
# `input_bytes`. Only the `input` of a verify, extend, extract or sign item (a document that
# may already be signed) may exceed `input_bytes`, by container bytes only; one byte more, or
# a document part past `input_bytes`, is `InputLimit`. Such an upload is spooled up to
# `input_bytes + container_bytes` before the engine classifies it (and the engine then copies about
# `input_bytes`: a hostile upload can write about 3 GiB at the defaults). Lower this together with
# `input_bytes`, and keep `temp_per_operation >= 3 * (input_bytes + container_bytes)` (not checked). It must cover what the service itself adds (a PAdES-LTA result
# carries its evidence). See docs/user/http-api.md.
container_bytes = 1073741824
memory_per_operation = 268435456
total_memory = 536870912
temp_per_operation = 8589934592
total_temp = 17179869184
framing_bytes = 67108864
# Metadata budget per operation: bounded XML/PDF/CMS metadata one operation (or one
# batch) may hold (default 64 MiB, minimum 32 KiB). A batch of several XML or PDF
# signatures needs a larger value (see docs/user/http-api.md, closed batch).
metadata_bytes = 67108864
inline_pkcs12 = false

# One entry per API client; the verifier is printed by `oncl-server token-create`.
# Actions: "hash", "verify", "extract", "inspect", "extend", "stamp", "verify_stamp",
# "sign", "sign_digest", and "batch" (the separate right for POST /v1/batch). `keys` are
# the names of the operator keys (below) this client may use; empty means none.
#
# [[tokens]]
# id = "accounting-service"
# verifier = "<64 lowercase hexadecimal verifier characters>"
# actions = ["hash", "verify"]
# keys = []

# A named operator key: a PKCS#12 or JKS container in the private directory and the file
# holding its password. Clients refer to the name only, never to the path.
#
# [[keys]]
# source = "file"
# name = "corporate-signing"
# path = "/etc/oncl-server/corporate.p12"
# secret = { directory = "/etc/oncl-server", name = "corporate.password" }

# Explicit trust for document verification and signer validation. There is no implicit
# trust store and PKI network access is denied unless an origin is pinned.
#
# [pki]
# anchors = ["/etc/oncl-server/roots/root.der"]
# intermediates = ["/etc/oncl-server/roots/intermediate.der"]
#
# [[pki.endpoints]]
# origin = "https://ca.example:443"
# addresses = ["203.0.113.10:443"]

# A WASM plugin is installed by the operator (code availability only; installation grants
# nothing) and reached through one exact grant per (token, operation); see docs/user/server.md,
# "Plugins". `imports` are the exact host imports the operation may use and `keys` the named
# operator keys above. A plugin that declares its operations (`[[operations]]` in its manifest)
# is granted only under a declared name with `server = true`, its imports must be among the
# declared ones (an empty list means all of them) and Core forces the declared signature
# options. Because the server cannot bind the signed bytes to a document, a key may be used
# only when the grant says `plugin_bytes = true`: "the plugin or its client chooses what the key
# signs". Without it the key use is refused before the key is touched (`not-granted`).
#
# [[plugins]]
# id = "vendor.sign"
# manifest = "/etc/oncl-server/plugins/sign.toml"
# wasm = "/etc/oncl-server/plugins/sign.wasm"
# [[plugins.permissions]]
# token = "accounting-service"
# operation = "sign-file"
# imports = ["keys_sign_cms_ex", "hash"]
# keys = ["corporate-signing"]
# plugin_bytes = true
# [[plugins.permissions]]
# token = "accounting-service"
# operation = "digest"
# imports = ["hash"]

# LAN exposure is a deliberate choice: real TLS with an operator PEM chain and key ...
#
# bind = "0.0.0.0:13579"
# hosts = ["signing.internal:13579"]
# exposure = { mode = "tls", certificate = "/etc/oncl-server/tls/server.crt", private_key = { directory = "/etc/oncl-server/tls", name = "server.key" } }
#
# ... or a TLS-terminating reverse proxy on a protected backend network:
#
# bind = "0.0.0.0:13579"
# hosts = ["signing.internal"]
# exposure = { mode = "trusted_proxy", peers = ["192.0.2.10"] }

# Optional OTLP metrics and traces (off by default; no thread or connection when off).
#
# [telemetry]
# enabled = true
# endpoint = "http://127.0.0.1:4318"
