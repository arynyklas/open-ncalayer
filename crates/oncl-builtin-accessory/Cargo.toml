[package]
name = "oncl-builtin-accessory"
description = "The kz.gov.pki.ncalayerservices.accessory module of OpenNCALayer as a built-in WebAssembly module: installed bundles, registered modules, bundle installation requests and the requests to open the daemon's windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `cdylib`: the module the core embeds (wasm32); `rlib`: its texts for the core's tools.
crate-type = ["cdylib", "rlib"]

[dependencies]
oncl-pdk.workspace = true
serde_json.workspace = true
