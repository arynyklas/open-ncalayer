[package]
name = "oncl-pki"
description = "BER normalization, keys, PKCS#8/PKCS#12, certificate checks, CMS, RFC 3161 time-stamping for OpenNCALayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["pki", "cms", "x509", "gost", "kazakhstan"]
categories = ["cryptography", "authentication"]
include = ["/src/**", "/roots/**", "/testing-data/**", "/LICENSE", "/NOTICE"]

[features]
# Test helpers: `tsp::MockTsa` (an in-process time-stamping authority),
# `ocsp::MockOcsp` (an in-process OCSP responder), `crl::MockCrl` (an in-process CRL
# distribution point), `http::RouteTransport` and `testing::issue_cert`.
testing = []
# `UreqTransport::with_extra_roots`: an extra CA on top of the webpki roots (conformance
# builds of the daemon, never releases).
extra-roots = ["dep:webpki-root-certs"]

[dependencies]
aes.workspace = true
base64.workspace = true
cbc.workspace = true
der.workspace = true
des.workspace = true
getrandom.workspace = true
gost94.workspace = true
hmac.workspace = true
# Response heads of plain HTTP sent through a proxy (`http::forward`).
httparse.workspace = true
oncl-gost.workspace = true
pbkdf2.workspace = true
pkcs8.workspace = true
rc2.workspace = true
ring.workspace = true
# Generation/decoding/public operations only; native backends own private operations.
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
spki.workspace = true
streebog.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
x509-cert.workspace = true
ureq.workspace = true
webpki-root-certs = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# Read only: the Internet Options proxy of `ProxySetting::System`.
oncl-registry.workspace = true
# Private SDK spool directories: explicit owner-only protected DACL at creation.
# These security/filesystem functions are available on Windows 7.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# Descriptor-relative private spool creation, unlink and no-clobber publication.
libc.workspace = true
aws-lc-rs.workspace = true

[dev-dependencies]
# Path only, no version: `cargo package` drops it, so that oncl-xml (which depends on this
# crate) is not a cycle of the published chain.
oncl-xml = { path = "../oncl-xml" }
hex-literal.workspace = true
oncl-testkit.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }

[target.'cfg(windows)'.dev-dependencies]
# `TestKey`: the registry sandbox of the Internet Options test.
oncl-registry = { path = "../oncl-registry", features = ["testing"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `listen` with a backlog of 0: a local address whose connections never complete.
libc.workspace = true

[[test]]
name = "tsp"
required-features = ["testing"]

[[test]]
name = "pkix"
required-features = ["testing"]

[[test]]
name = "ocsp"
required-features = ["testing"]

[[test]]
name = "crl"
required-features = ["testing"]

[[test]]
name = "keystore"
required-features = ["testing"]

[[test]]
name = "cms_report"
required-features = ["testing"]

[[test]]
name = "cms_stream"
required-features = ["testing"]

[[test]]
name = "cms_stream_sign"
required-features = ["testing"]
