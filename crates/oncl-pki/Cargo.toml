[package]
name = "oncl-pki"
description = "BER normalization, keys, PKCS#8/PKCS#12, certificate checks, CMS and RFC 3161 time-stamping for OpenNCALayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# PKCS#12 writer (test fixtures, xtask).
write = []
# Test helpers: `tsp::MockTsa` (an in-process time-stamping authority),
# `ocsp::MockOcsp` (an in-process OCSP responder), `crl::MockCrl` (an in-process CRL
# distribution point), `http::RouteTransport` and `testing::issue_cert`.
testing = []

[dependencies]
aes.workspace = true
base64.workspace = true
cbc.workspace = true
der.workspace = true
des.workspace = true
getrandom.workspace = true
hmac.workspace = true
oncl-gost.workspace = true
pbkdf2.workspace = true
pkcs8.workspace = true
rc2.workspace = true
ring.workspace = true
sha1.workspace = true
sha2.workspace = true
spki.workspace = true
thiserror.workspace = true
time.workspace = true
x509-cert.workspace = true
ureq.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex-literal.workspace = true
oncl-testkit.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }

[[test]]
name = "tsp"
required-features = ["testing"]

[[test]]
name = "pkix"
required-features = ["testing"]

[[test]]
name = "ocsp"
required-features = ["testing"]

[[test]]
name = "crl"
required-features = ["testing"]
