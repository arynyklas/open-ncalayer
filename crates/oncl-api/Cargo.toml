[package]
name = "oncl-api"
description = "OpenNCALayer HTTP hash DTO and optional server transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:axum", "dep:multer", "dep:futures-util"]

[dependencies]
serde.workspace = true
axum = { workspace = true, optional = true }
multer = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
oncl-server = { path = "../oncl-server" }
tempfile.workspace = true
serde_json.workspace = true
zeroize.workspace = true
oncl-pki.workspace = true
oncl-testkit.workspace = true
