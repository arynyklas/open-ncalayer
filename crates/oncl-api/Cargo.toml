[package]
name = "oncl-api"
description = "OpenNCALayer HTTP hash DTO and optional server transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:axum", "dep:multer", "dep:futures-util"]

[dependencies]
serde.workspace = true
axum = { workspace = true, optional = true }
multer = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
oncl-server = { path = "../oncl-server" }
tempfile.workspace = true
serde_json.workspace = true
zeroize.workspace = true
oncl-pki = { workspace = true, features = ["testing"] }
der.workspace = true
time.workspace = true
oncl-testkit.workspace = true
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
mime = "=0.3.17"
