[package]
name = "oncl-desktop"
description = "OpenNCALayer desktop integration without windows: settings.json and autostart at login"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oncl-basics.workspace = true
oncl-pki.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Our `Run` value and its `StartupApproved` state.
oncl-registry.workspace = true
# kernel32 `GetUserDefaultUILanguage`: the default language.
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# `TestKey`: the registry sandbox of the tests.
oncl-registry = { path = "../oncl-registry", features = ["testing"] }
