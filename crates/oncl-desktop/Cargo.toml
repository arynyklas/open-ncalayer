[package]
name = "oncl-desktop"
description = "OpenNCALayer desktop integration without windows: settings.json, autostart at login and the Windows registry helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oncl-basics.workspace = true
oncl-pki.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# advapi32 registry functions of Windows Vista and later (our `Run` value, the native
# messaging host keys); kernel32 `GetUserDefaultUILanguage` (the default language).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile.workspace = true
