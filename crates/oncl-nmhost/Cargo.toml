[package]
name = "oncl-nmhost"
description = "Native messaging host of OpenNCALayer: relays the browser extension's frames to the daemon over local IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nmhost"
path = "src/main.rs"

[dependencies]
oncl-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt", "sync"] }

[dev-dependencies]
tempfile.workspace = true
