[package]
name = "oncl-commonutils"
description = "The kz.gov.pki.knca.commonUtils module of OpenNCALayer: the original's reflective dispatcher over key info, XML, CAdES and CMS signing, CAdES-T, the file chooser and the dialog language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
der.workspace = true
oncl-basics.workspace = true
oncl-pki.workspace = true
oncl-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
x509-cert.workspace = true

[dev-dependencies]
# `testing`: `ScriptedPrompter`.
oncl-basics = { path = "../oncl-basics", features = ["testing"] }
# `testing`: `tsp::MockTsa`.
oncl-pki = { path = "../oncl-pki", features = ["testing"] }
oncl-testkit.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# A named pipe server for the test that page-named pipes are refused.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
