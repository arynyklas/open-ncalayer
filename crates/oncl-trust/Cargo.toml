[package]
name = "oncl-trust"
description = "OpenNCALayer trust stores: read-only trust checks of the local CA and its explicit install into or removal from the user's own store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
x509-cert = { workspace = true, features = ["pem"] }

[target.'cfg(windows)'.dependencies]
# crypt32: CurrentUser\Root and the other Root stores, the chain engine and the SSL policy.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
# SecTrust evaluation and the user/admin trust settings (read-only checks).
security-framework.workspace = true
# The CA file `security add-trusted-cert` reads.
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Read-only presence check in an NSS `cert9.db` when `certutil` is not installed.
rusqlite.workspace = true

[dev-dependencies]
oncl-tls.workspace = true
tempfile.workspace = true
time.workspace = true
