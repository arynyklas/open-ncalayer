[package]
name = "oncl-plugin"
description = "OpenNCALayer's plugins: the package (`.onclp`), its manifest (`plugin.toml`) and the WebAssembly runtime they run in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The DER of a chosen key's certificate.
der.workspace = true
# `random`: the system's generator.
getrandom.workspace = true
# `Locale`, the dialogs and the key choice of the `keys`, `dialogs` and `files` capabilities.
oncl-basics.workspace = true
# The ABI: what the host functions take and return.
oncl-pdk.workspace = true
# Signing, time-stamps, certificate details and the HTTP transport of the capabilities.
oncl-pki.workspace = true
# `AddInfo`, `SessionId`: what a call comes with.
oncl-protocol.workspace = true
# `Tokens`: the hardware tokens the `keys` capability's storage dialog offers.
oncl-token.workspace = true
# `Store`: the catalog (the signed update index) kept and verified again, the package sums.
oncl-update.workspace = true
semver.workspace = true
serde.workspace = true
# `Store`: `state.json`.
serde_json.workspace = true
# `Package::sha256`: checked against the update index.
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
# `HttpPrefix`: the URLs a plugin may reach.
url.workspace = true
wasmi.workspace = true
zip.workspace = true
# The passwords of `dialog_password`, wiped when dropped.
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# `local_time`: the system's time zone at an instant.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Time"] }

[target.'cfg(unix)'.dependencies]
# `local_time`: the system's time zone at an instant (`localtime_r`).
libc.workspace = true

[dev-dependencies]
base64.workspace = true
# Catalogs signed in the store's tests.
minisign.workspace = true
oncl-basics = { path = "../oncl-basics", features = ["testing"] }
# `testing`: `tsp::MockTsa`, `RouteTransport`.
oncl-pki = { path = "../oncl-pki", features = ["testing"] }
oncl-testkit.workspace = true
# `emulator`: software tokens for the `keys` capability's token tests.
oncl-token = { path = "../oncl-token", features = ["emulator"] }
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tracing-subscriber.workspace = true
wat.workspace = true
