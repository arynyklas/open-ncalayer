[package]
name = "oncl-plugin"
description = "OpenNCALayer's plugins: the package (`.onclp`) and its manifest (`plugin.toml`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `Locale`: the language a plugin's name and description are shown in.
oncl-basics.workspace = true
semver.workspace = true
serde.workspace = true
# `Package::sha256`: checked against the update index.
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
# `HttpPrefix`: the URLs a plugin may reach.
url.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
