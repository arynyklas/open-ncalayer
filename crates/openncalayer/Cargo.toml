[package]
name = "openncalayer"
description = "OpenNCALayer daemon: NCALayer-compatible wss/https server on 127.0.0.1 and its command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `e2e-prompter`: with `ONCL_E2E_PROMPTER=<steps.json>` set, `run` answers the signing
# dialogs from that script and opens no windows (end-to-end tests). Never in releases.
e2e-prompter = ["oncl-basics/testing"]

[dependencies]
oncl-accessory.workspace = true
oncl-applet.workspace = true
oncl-basics.workspace = true
oncl-commonutils.workspace = true
oncl-desktop.workspace = true
oncl-ipc.workspace = true
oncl-pki.workspace = true
oncl-protocol.workspace = true
oncl-registry.workspace = true
oncl-tls.workspace = true
oncl-ui.workspace = true

base64.workspace = true
clap.workspace = true
futures-util.workspace = true
httparse.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
# `sync`: the bridge's queues; `macros`: `select!` over the bridge and the wss server.
tokio = { workspace = true, features = ["macros", "sync"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
# `testing`: `ScriptedPrompter`, `MemoryRecentPath`, `tsp::MockTsa`, `ocsp::MockOcsp`,
# `crl::MockCrl` and `http::RouteTransport`.
oncl-basics = { path = "../oncl-basics", features = ["testing"] }
oncl-pki = { path = "../oncl-pki", features = ["testing"] }
# A `log` record must reach the log file through the `tracing-log` bridge.
log.workspace = true
oncl-testkit.workspace = true
sha2.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
