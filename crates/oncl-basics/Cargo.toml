[package]
name = "oncl-basics"
description = "The kz.gov.pki.knca.basics module of OpenNCALayer: PKIExtras.sign (cms, raw, xml) and PKIEssentials (generateCsr, importCertificate) behind a Prompter UI abstraction, and the page-path rules every module shares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testing`: `ScriptedPrompter` and `MemoryRecentPath` for tests of this crate and its users.
testing = []

[dependencies]
base64.workspace = true
der.workspace = true
oncl-pki.workspace = true
oncl-protocol.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
x509-cert.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# `GetFileType`: page-named files must be disk files, not pipes or devices.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# `testing`: `tsp::MockTsa`, `ocsp::MockOcsp`, `testing::issue_cert`.
oncl-pki = { path = "../oncl-pki", features = ["testing"] }
oncl-testkit.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# A named pipe server for the test that a chosen network pipe is refused by `GetFileType`.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

[[test]]
name = "essentials"
required-features = ["testing"]

[[test]]
name = "keys"
required-features = ["testing"]

[[test]]
name = "sign"
required-features = ["testing"]

[[test]]
name = "validation"
required-features = ["testing"]
