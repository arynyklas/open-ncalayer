[package]
name = "oncl-basics"
description = "The kz.gov.pki.knca.basics module of OpenNCALayer: PKIExtras.sign (cms, raw, xml) and PKIEssentials (generateCsr, importCertificate) behind a Prompter UI abstraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testing`: `ScriptedPrompter` and `MemoryRecentPath` for tests of this crate and its users.
testing = []

[dependencies]
base64.workspace = true
der.workspace = true
oncl-pki.workspace = true
oncl-protocol.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
x509-cert.workspace = true
zeroize.workspace = true

[dev-dependencies]
# `testing`: `tsp::MockTsa`, `ocsp::MockOcsp`, `testing::issue_cert`.
oncl-pki = { path = "../oncl-pki", features = ["testing"] }
oncl-testkit.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tracing-subscriber.workspace = true

[[test]]
name = "essentials"
required-features = ["testing"]

[[test]]
name = "sign"
required-features = ["testing"]

[[test]]
name = "validation"
required-features = ["testing"]
