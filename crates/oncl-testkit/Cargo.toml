[package]
name = "oncl-testkit"
description = "Test helpers for OpenNCALayer crates: workspace paths, fixture lookup and app-local DLL loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
# `plugin::example_package`: the example plugin as a `.onclp` package.
zip.workspace = true

[target.'cfg(windows)'.dependencies]
object.workspace = true
serde_json.workspace = true
tempfile.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
