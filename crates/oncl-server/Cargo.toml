[package]
name = "oncl-server"
description = "Explicitly enabled bounded standalone OpenNCALayer service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test/embedding hooks (card backend injection). Never enabled by the binary.
test-support = []

[dependencies]
oncl-pki.workspace = true
getrandom.workspace = true
oncl-api = { path = "../oncl-api", features = ["server"] }
oncl-core = { workspace = true, features = ["tokens", "xml", "pdf", "jose", "plugins"] }
oncl-token.workspace = true
tracing.workspace = true
axum.workspace = true
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
http-body-util = { version = "=0.1.5", default-features = false }
tokio = { workspace = true, features = ["sync", "macros", "signal"] }
tokio-rustls.workspace = true
rustls.workspace = true
ring.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zeroize.workspace = true
futures-util.workspace = true
multer.workspace = true
time.workspace = true
der.workspace = true
oncl-pdf.workspace = true
oncl-xml.workspace = true
oncl-plugin.workspace = true
oncl-pdk.workspace = true
# Opt-in OTLP/HTTP protobuf export (docs/user/server.md "Telemetry"). Server-only: the SDK
# and desktop closures never contain these. The HTTP client is the workspace `ureq`
# (rustls+ring), not the OTLP crate's reqwest; no gRPC, no logs, no internal-logs bridge.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "trace", "metrics"] }
opentelemetry-http = { version = "=0.33.1", default-features = false }
ureq.workspace = true
http = "=1.5.0"
async-trait = "=0.1.92"
bytes = "=1.12.1"

[dev-dependencies]
oncl-pki = { workspace = true, features = ["testing"] }
oncl-core = { workspace = true, features = ["testing"] }
oncl-testkit.workspace = true
tempfile.workspace = true
rsa.workspace = true
time = { workspace = true, features = ["macros"] }
oncl-token = { workspace = true, features = ["emulator"] }
rcgen.workspace = true
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
socket2 = "=0.6.5"
# The test collector decodes the exact OTLP protobuf messages the exporter sends.
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
