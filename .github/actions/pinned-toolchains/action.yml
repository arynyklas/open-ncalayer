name: Pinned toolchains only
description: >-
  Uninstalls every Rust toolchain but the one rust-toolchain.toml pins and those named in
  `keep`. rust-cache puts the version of every installed toolchain into its cache key, so
  the toolchain a runner image brings along (its `stable`, which changes from one image to
  the next) would change the key and miss the cache. Run it after installing the toolchains
  and before rust-cache.
inputs:
  keep:
    description: Further toolchains to keep, space-separated (e.g. `nightly-2026-08-12`)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Uninstall the toolchains nothing pins
      shell: bash
      env:
        KEEP: ${{ inputs.keep }}
      run: |
        # shellcheck disable=SC2206 # KEEP is a space-separated list of names.
        keep=("$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" $KEEP)
        rustup toolchain list | cut -d ' ' -f 1 | while read -r toolchain; do
          for name in "${keep[@]}"; do
            if [[ "$toolchain" == "$name-"* ]]; then continue 2; fi
          done
          rustup toolchain uninstall "$toolchain"
        done
        rustup toolchain list
