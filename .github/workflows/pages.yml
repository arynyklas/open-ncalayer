name: Pages

# GitHub Pages of the project: the update indexes `updates/` under `/updates/`
# (`/updates/v1/<channel>.json`). Pages is one artifact for the whole site: later pages of
# the site go into `_site` beside `updates/`. Pages must be enabled with "GitHub Actions"
# as the source in the repository settings.
on:
  push:
    branches: [main]
    paths: ["updates/**", "crates/oncl-update/keys/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The push's previous commit (`seq` is compared against it) and the release tags
          # (every new version's tag must hold a trusted update key).
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Nothing unsigned, expired or pointing elsewhere is published, even if pushed past the
      # pull request check; on a push, changed content needs a greater `seq` than the
      # commit before the push. The first push (or a manual run) checks without a base.
      - name: Check the indexes
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$BEFORE^{commit}"
            cargo xtask index check updates/v1 --base "$BEFORE"
          else
            cargo xtask index check updates/v1 --no-base
          fi
      - name: Site
        run: |
          mkdir _site
          cp -R updates _site/updates
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
