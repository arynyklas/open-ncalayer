name: Release

# A `v*` tag publishes a GitHub release: the daemon and the relay for Windows (x64, x86, and
# Windows 7 x64/x86 with their app-local DLLs), Linux and macOS, the browser extension, and
# SHA256SUMS. A tag with a pre-release suffix (`v0.1.0-alpha.1`) makes a pre-release.
# Binaries are not code-signed yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the workspace version
        id: check
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml declares $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-2025
            target: i686-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p openncalayer -p oncl-nmhost
      - name: Package
        shell: bash
        run: |
          name="openncalayer-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          out="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$out/openncalayer.exe" "$out/nmhost.exe" "dist/$name/"
          else
            cp "$out/openncalayer" "$out/nmhost" "dist/$name/"
          fi
          cp README.md README.en.md LICENSE NOTICE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Windows 7 SP1 (roadmap D14): the executables with their app-local DLLs, built, checked
  # for imports Windows 7 lacks and started by `cargo xtask win7`.
  win7:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains (rust-toolchain.toml for xtask, pinned nightly for Win7)
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
      - name: Build, check imports, start
        run: cargo xtask win7 --arch ${{ matrix.arch }}
      - name: Package
        shell: bash
        run: |
          name="openncalayer-${{ needs.version.outputs.version }}-win7-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/win7/${{ matrix.arch }}/*.exe target/win7/${{ matrix.arch }}/*.dll "dist/$name/"
          cp README.md README.en.md LICENSE NOTICE "dist/$name/"
          cd dist
          7z a -tzip "$name.zip" "$name" > /dev/null
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-win7-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo xtask ext build
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/openncalayer-chromium-*.zip
            target/extension/openncalayer-firefox-*.xpi
          if-no-files-found: error

  publish:
    needs: [version, binaries, win7, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenNCALayer ${{ needs.version.outputs.version }}" \
            --generate-notes \
            "${flags[@]}"
