name: Release

# A `v*` tag publishes a GitHub release: the daemon and the relay for Windows (x64, x86, and
# Windows 7 x64/x86 with their app-local DLLs), Linux and macOS as archives and as Velopack
# packages (the update index points at those), the browser extension, a CycloneDX SBOM and
# SHA256SUMS, every file with a build provenance attestation. A tag with a pre-release
# suffix (`v0.1.0-alpha.1`) makes a pre-release.
# Then a pull request adds the version to the update indexes (`updates/v1/<channel>.json`:
# a pre-release to beta, a release to stable and beta), unsigned: the maintainer signs them
# locally (`cargo xtask sign`), never CI.
#
# Code signing runs only with its secrets, otherwise it is skipped with a notice:
# Authenticode through SignPath (secret SIGNPATH_API_TOKEN, variables
# SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG) signs
# openncalayer.exe and nmhost.exe of both the archive and the package (the app-local DLLs of
# the Windows 7 builds stay unsigned); Apple signing and notarization
# (secrets APPLE_CERTIFICATE_P12 (base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGN_IDENTITY,
# APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD) covers the macOS Velopack package only: the
# macOS archive stays unsigned.
#
# Third-party actions are pinned to a commit, with the release tag in a comment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Velopack CLI of the `velopack` crate in Cargo.lock.
  VPK_VERSION: 1.3.39-g8d2844f

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the workspace version
        id: check
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml declares $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # One build per Velopack flavor (`oncl_update::Flavor`): the archive and the package.
  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            flavor: win-x64
            runtime: win-x64
          - os: windows-2025
            target: i686-pc-windows-msvc
            flavor: win-x86
            runtime: win-x86
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            flavor: linux-x64
            runtime: linux-x64
          # The `osx` flavor is every Mac's (`Flavor::current`, Intel and Apple silicon):
          # both architectures, joined by lipo, packed without an architecture.
          - os: macos-15
            target: universal-apple-darwin
            flavor: osx
            runtime: osx
          # Windows 7 SP1 (roadmap D14): `cargo xtask win7` builds the executables and the
          # app-local DLLs, checks them against the denylist of imports missing on Windows 7
          # and starts them; the package's contents, Velopack's own executables included,
          # pass the same gate after `vpk pack`.
          - os: windows-2025
            target: x86_64-win7-windows-msvc
            win7: x64
            flavor: win7-x64
            runtime: win-x64
          - os: windows-2025
            target: i686-win7-windows-msvc
            win7: x86
            flavor: win7-x86
            runtime: win-x86
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.win7 && 90 || 60 }}
    # `actions: read` for SignPath: its `github-token` reads the job details and downloads
    # the unsigned artifact, "Requires the `action:read` and `content:read` permissions"
    # (docs.signpath.io/trusted-build-systems/github, input `github-token`, action v3).
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      FLAVOR: ${{ matrix.flavor }}
      BIN: ${{ matrix.win7 && format('target/win7/{0}', matrix.win7) || format('target/{0}/release', matrix.target) }}
      # The archive's name: `openncalayer-<version>-<archive>`.
      ARCHIVE: ${{ matrix.win7 && format('win7-{0}', matrix.win7) || matrix.target }}
      # Only whether the signing secrets exist: the secrets reach their signing steps alone.
      SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGN_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Install toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.win7 }}" ]; then
            # The pinned nightly of `cargo xtask win7` (xtask::win7::TOOLCHAIN).
            rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
          elif [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi
      - name: Build
        if: matrix.target != 'universal-apple-darwin' && !matrix.win7
        run: cargo build --locked --release --target ${{ matrix.target }} -p openncalayer -p oncl-nmhost
      - name: Build, check imports, start (Windows 7)
        if: matrix.win7
        run: cargo xtask win7 --arch ${{ matrix.win7 }}
      # Both slices, joined; a slice missing fails the job (no arm64-only `osx` package).
      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p openncalayer -p oncl-nmhost
          done
          mkdir -p "$BIN"
          for exe in openncalayer nmhost; do
            lipo -create -output "$BIN/$exe" \
              "target/x86_64-apple-darwin/release/$exe" "target/aarch64-apple-darwin/release/$exe"
            archs="$(lipo -archs "$BIN/$exe")"
            echo "$exe: $archs"
            case " $archs " in
              *" x86_64 "*" arm64 "*|*" arm64 "*" x86_64 "*) ;;
              *) echo "::error::$exe is not universal: $archs"; exit 1 ;;
            esac
          done

      # Authenticode before anything is packed: the archive and the package get the signed
      # binaries.
      - name: Keep the unsigned binaries for SignPath
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-${{ matrix.flavor }}
          path: |
            ${{ env.BIN }}/openncalayer.exe
            ${{ env.BIN }}/nmhost.exe
          if-no-files-found: error
      - name: Sign the Windows binaries (Authenticode, SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.BIN }}
      - name: Authenticode skipped
        if: runner.os == 'Windows' && env.SIGNPATH != 'true'
        shell: bash
        run: |
          echo "::notice::SignPath is not configured (secret SIGNPATH_API_TOKEN, variables SIGNPATH_*): the $FLAVOR binaries are not signed"

      - name: Package
        shell: bash
        run: |
          name="openncalayer-$VERSION-$ARCHIVE"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$BIN/openncalayer.exe" "$BIN/nmhost.exe" "dist/$name/"
            if [ -n "${{ matrix.win7 }}" ]; then
              cp "$BIN/combase.dll" "$BIN/api-ms-win-core-winrt-error-l1-1-0.dll" "dist/$name/"
            fi
          else
            cp "$BIN/openncalayer" "$BIN/nmhost" "dist/$name/"
          fi
          cp README.md README.en.md LICENSE NOTICE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      # The full package the delta is made from: of the release with the highest version
      # below this one that has the flavor's full package, among releases for a release and
      # among releases and pre-releases for a pre-release. It comes straight from that
      # release (`vpk download github` reads only the newest 10 releases) and must match the
      # release's SHA256SUMS. `vpk pack` takes the delta's base from the packages in its
      # output directory and writes the feed `releases.<flavor>.json` from them, so no older
      # feed is needed. Only when no such release exists is there no delta; any other
      # failure fails the job.
      - name: Download the previous package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]
            | select(.draft | not)
            | select(env.PRERELEASE == "true" or (.prerelease | not))
            | select(.tag_name | startswith("v"))
            | select(IN(.assets[].name; "OpenNCALayer-\(.tag_name[1:])-\(env.FLAVOR)-full.nupkg"))
            | .tag_name' \
            | jq -Rnr --arg current "$GITHUB_REF_NAME" '
              # `v<semver>` as a key in semver order: the numbers, then a pre-release before
              # its release, numeric identifiers before others (jq orders numbers first).
              def key: ltrimstr("v") | split("+")[0] | index("-") as $i
                | if $i == null then [(split(".") | map(tonumber)), [1]]
                  else [(.[:$i] | split(".") | map(tonumber)),
                    [0, (.[$i + 1:] | split(".") | map(tonumber? // .))]]
                  end;
              [inputs | select(key < ($current | key))] | max_by(key) // empty')"
          if [ -z "$previous" ]; then
            echo "::notice::no earlier release has a $FLAVOR package: no delta"
            exit 0
          fi
          package="OpenNCALayer-${previous#v}-$FLAVOR-full.nupkg"
          mkdir -p packages previous
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" --dir previous \
            --pattern "$package" --pattern SHA256SUMS
          expected="$(awk -v name="$package" '$2 == name { print $1 }' previous/SHA256SUMS)"
          if command -v sha256sum > /dev/null; then
            actual="$(sha256sum < "previous/$package" | cut -d ' ' -f 1)"
          else
            actual="$(shasum -a 256 < "previous/$package" | cut -d ' ' -f 1)"
          fi
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::$package of $previous does not match its SHA256SUMS (${expected:-no entry}, got $actual)"
            exit 1
          fi
          mv "previous/$package" packages/
          echo "the $FLAVOR delta is made from $package of $previous"
      - name: Apple signing keychain and notary profile
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials openncalayer --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          # `vpk pack` reads these: it signs the app bundle and notarizes it.
          {
            echo "VPK_KEYCHAIN=$keychain"
            echo "VPK_NOTARY_PROFILE=openncalayer"
            echo "VPK_SIGN_APP_IDENTITY=$APPLE_SIGN_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Apple notarization skipped
        if: runner.os == 'macOS' && env.APPLE_SIGNING != 'true'
        run: |
          echo "::notice::Apple signing is not configured (secrets APPLE_*): the $FLAVOR package is not signed or notarized"
      # Packages only: the installers (Setup.exe, .pkg) come later; Velopack's portable
      # bundle and the AppImage are not published.
      - name: Velopack package
        shell: bash
        run: |
          mkdir pack
          case "$RUNNER_OS" in
            Windows)
              exe=openncalayer.exe
              cp "$BIN/openncalayer.exe" "$BIN/nmhost.exe" pack/
              if [ -n "${{ matrix.win7 }}" ]; then
                cp "$BIN/combase.dll" "$BIN/api-ms-win-core-winrt-error-l1-1-0.dll" pack/
              fi
              # The tray icon as a one-image .ico (a PNG entry, Windows Vista and later). The
              # directory entry below says 32x32, 32 bpp: the PNG must be exactly that.
              png=crates/oncl-ui/assets/tray-ok.png
              # IHDR: width, height (big-endian 32-bit), bit depth 8, colour type 6 (RGBA).
              ihdr="$(od -An -tu1 -j16 -N10 "$png" | tr -s ' ' | sed 's/^ //')"
              if [ "$ihdr" != "0 0 0 32 0 0 0 32 8 6" ]; then
                echo "::error::$png is not a 32x32 RGBA PNG (IHDR $ihdr): fix the .ico header"
                exit 1
              fi
              # A 32-bit little-endian number.
              le32() {
                for shift in 0 8 16 24; do
                  printf '%b' "\\x$(printf %02x $(($1 >> shift & 255)))"
                done
              }
              {
                printf '\x00\x00\x01\x00\x01\x00\x20\x20\x00\x00\x01\x00\x20\x00'
                le32 "$(wc -c < "$png")"
                le32 22
                cat "$png"
              } > "$RUNNER_TEMP/openncalayer.ico"
              options=(--noInst --icon "$RUNNER_TEMP/openncalayer.ico")
              ;;
            Linux)
              exe=openncalayer
              cp "$BIN/openncalayer" "$BIN/nmhost" pack/
              # The Linux pack makes only the AppImage, and has no --noInst.
              options=(--icon crates/oncl-ui/assets/tray-ok.png)
              ;;
            macOS)
              exe=openncalayer
              cp "$BIN/openncalayer" "$BIN/nmhost" pack/
              # vpk takes only an .icns icon on macOS, and there is none yet.
              options=(--noInst)
              ;;
          esac
          cp README.md README.en.md LICENSE NOTICE pack/
          vpk --skip-updates pack --packId OpenNCALayer --packVersion "$VERSION" \
            --packTitle OpenNCALayer --packAuthors "OpenNCALayer contributors" \
            --packDir pack --mainExe "$exe" --channel "$FLAVOR" --runtime "${{ matrix.runtime }}" \
            --outputDir packages "${options[@]}"
          # This version's packages and the flavor's feed (`cargo xtask index add` reads the
          # delta's base version from it); not the downloaded previous package.
          mkdir velopack
          cp "packages/OpenNCALayer-$VERSION-$FLAVOR-full.nupkg" "packages/releases.$FLAVOR.json" velopack/
          for file in "packages/OpenNCALayer-$VERSION-$FLAVOR-delta.nupkg" "packages/RELEASES-$FLAVOR"; do
            if [ -f "$file" ]; then
              cp "$file" velopack/
            fi
          done
          ls -l velopack
      # What a Windows 7 installation runs from the package: our executables beside their
      # app-local DLLs, Velopack's Update.exe (`Squirrel.exe` in the package) and its stub.
      - name: Windows 7 package through the import gate
        if: matrix.win7
        shell: bash
        run: |
          package="packages/OpenNCALayer-$VERSION-$FLAVOR-full.nupkg"
          7z x "$package" -owin7-package > /dev/null
          app=win7-package/lib/app
          for file in openncalayer.exe nmhost.exe combase.dll api-ms-win-core-winrt-error-l1-1-0.dll Squirrel.exe; do
            if [ ! -f "$app/$file" ]; then
              echo "::error::$file is not in $package"
              ls -l "$app"
              exit 1
            fi
          done
          mapfile -t exes < <(find "$app" -maxdepth 1 -iname '*.exe')
          cargo xtask check-imports "${exes[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-velopack-${{ matrix.flavor }}
          path: velopack/*
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo xtask ext build
      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: |
            target/extension/openncalayer-chromium-*.zip
            target/extension/openncalayer-firefox-*.xpi
          if-no-files-found: error

  # One CycloneDX SBOM of the daemon and the relay, the dependencies of every platform.
  sbom:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx@0.5.9
      # cargo-cyclonedx writes one SBOM per workspace package; the relay's adds only itself
      # to the daemon's.
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all --no-build-deps \
            --override-filename sbom --quiet
          mkdir sbom
          jq -s '.[0] as $daemon | .[1] as $relay | $daemon
            | .components = (.components + $relay.components + [$relay.metadata.component]
                | unique_by(."bom-ref"))
            | .dependencies = (.dependencies + $relay.dependencies | unique_by(.ref))' \
            crates/openncalayer/sbom.json crates/oncl-nmhost/sbom.json \
            > "sbom/openncalayer-$VERSION.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: sbom/*
          if-no-files-found: error

  publish:
    needs: [version, binaries, extension, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenNCALayer $VERSION" \
            --generate-notes \
            "${flags[@]}"

  # The version into the update indexes: a pre-release into beta only, a release into
  # stable and into beta, so a beta installation is offered it too. Each index gets its own
  # next `seq` and keeps its versions. A pull request with the unsigned indexes; the
  # maintainer signs every one of them on the PR branch, and the index check then runs on
  # that push.
  index:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # The build below runs build scripts; create-pull-request brings its own token.
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # `index add` refuses a tag without a trusted update key: a build without one cannot
      # update itself, so no installation may be moved onto it. Such a release (before the
      # maintainer's keys exist) gets no index pull request, with a notice.
      - name: The tag's update key
        id: key
        run: |
          git fetch --no-tags --depth 1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if git cat-file -e "refs/tags/$GITHUB_REF_NAME:crates/oncl-update/keys/current.pub"; then
            echo "keyed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF_NAME has no crates/oncl-update/keys/current.pub: its build cannot update itself; it is not added to the update indexes"
            echo "keyed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the release
        if: steps.key.outputs.keyed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern '*.nupkg' --pattern 'releases.*.json' \
            --pattern 'openncalayer-chromium-*.zip' --pattern 'openncalayer-firefox-*.xpi'
      - name: Add the version to the indexes
        if: steps.key.outputs.keyed == 'true'
        id: add
        run: |
          if [ "$PRERELEASE" = true ]; then
            channels=(beta)
            subject="the beta index"
          else
            channels=(stable beta)
            subject="the stable and beta indexes"
          fi
          for channel in "${channels[@]}"; do
            cargo xtask index add --channel "$channel" --tag "$GITHUB_REF_NAME" \
              --release-assets "$RUNNER_TEMP/assets"
          done
          {
            echo "Adds $VERSION to $subject (\`cargo xtask index add\`, rollout 100 %): a release goes into \`stable\` and \`beta\`, a pre-release into \`beta\` only."
            echo
            echo "The indexes are unsigned, and the index check refuses an unsigned one. To publish them, on this branch:"
            echo
            echo "1. optionally lower \`rollout\` of the new version;"
            echo "2. sign every index of this PR:"
            for channel in "${channels[@]}"; do
              echo "   - \`cargo xtask sign updates/v1/$channel.json --key <secret key>\`"
            done
            echo "3. \`cargo xtask index check updates/v1 --base origin/main\`;"
            echo "4. commit the indexes and their \`.minisig\` files and push: the index check runs on that push;"
            echo "5. merge: GitHub Pages publishes \`updates/\`."
          } > "$RUNNER_TEMP/index-pr.md"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Open the index pull request
        if: steps.key.outputs.keyed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # The indexes and the removal of their stale signatures.
          add-paths: updates/v1
          branch: updates/${{ github.ref_name }}
          base: main
          commit-message: "chore(updates): add ${{ env.VERSION }} to ${{ steps.add.outputs.subject }}"
          title: "chore(updates): add ${{ env.VERSION }} to ${{ steps.add.outputs.subject }}"
          body-path: ${{ runner.temp }}/index-pr.md
