name: Release

# A `v*` tag publishes a GitHub release: the daemon and the relay for Windows, Linux and
# macOS, the browser extension, and SHA256SUMS. A tag with a pre-release suffix
# (`v0.1.0-alpha.1`) makes a pre-release. Binaries are not code-signed yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the workspace version
        id: check
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml declares $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: cargo build --locked --release -p openncalayer -p oncl-nmhost
      - name: Package
        shell: bash
        run: |
          name="openncalayer-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/openncalayer.exe target/release/nmhost.exe "dist/$name/"
          else
            cp target/release/openncalayer target/release/nmhost "dist/$name/"
          fi
          cp README.md README.en.md LICENSE NOTICE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo xtask ext build
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/openncalayer-chromium-*.zip
            target/extension/openncalayer-firefox-*.xpi
          if-no-files-found: error

  publish:
    needs: [version, binaries, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenNCALayer ${{ needs.version.outputs.version }}" \
            --generate-notes \
            "${flags[@]}"
