name: Index check

# A pull request that changes the update indexes: `cargo xtask index check` (format,
# signature by a trusted key, validity, asset URLs on the project's releases answering
# HEAD with 200, `seq` growth against the base branch).
on:
  pull_request:
    paths: ["updates/**", "crates/oncl-update/keys/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The base branch too: `seq` is compared against its indexes.
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check the indexes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask index check updates/v1 --base "origin/$BASE_REF"
