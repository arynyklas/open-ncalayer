name: CI

on:
  push:
  pull_request:
  # Only the `live` job (real NCA services) runs on these two triggers.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every platform's packages: the licences test (`committed_licenses_are_fresh`) reads
      # their licence files offline.
      - name: Fetch packages
        run: cargo fetch --locked
      - name: Test
        shell: bash
        run: cargo xtask fetch-fixtures && cargo test --workspace --all-features -- --include-ignored --skip live_
      # The `clippy` job runs on Linux and never sees `cfg(windows)` code (oncl-ui foreground).
      - name: Clippy (Windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The app-local DLLs of the Windows 7 builds are workspace members; on Windows their
      # tests build them.
      - name: Build the Windows 7 app-local DLLs
        if: runner.os != 'Windows'
        run: cargo build -p oncl-win7shim-combase -p oncl-win7shim-winrt-error
      - name: CMS interop with OpenSSL
        if: runner.os == 'Linux'
        run: cargo xtask interop-openssl

  deny:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  extension:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Only whether the AMO secrets exist: the secrets themselves reach the signing step alone.
      AMO_SIGNING: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A glob, not the directory: since Node 21 `--test` arguments are patterns.
      - run: node --test "extension/test/*.test.mjs"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask ext build
      # Unlisted AMO signing (roadmap D6). Skipped without the secrets; release tags (`v*`)
      # only, because AMO refuses a version it has already signed.
      - name: Sign the Firefox add-on (AMO, unlisted)
        if: env.AMO_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          npx --yes web-ext@10.8.0 sign --channel unlisted
          --source-dir target/extension/firefox --artifacts-dir target/extension/signed
      - name: Keep the signed add-on
        if: env.AMO_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: openncalayer-firefox-signed
          path: target/extension/signed/*.xpi
          if-no-files-found: error

  # The extension in Chrome for Testing, Firefox and Firefox ESR 115, over native messaging to
  # the daemon.
  ext-e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # libdbus-glib-1-2: Firefox ESR 115 links libdbus-glib-1.so.2 (later Firefox does not).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl libdbus-glib-1-2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p openncalayer --features e2e-prompter -p oncl-nmhost
      - run: cargo xtask ext build
      - run: cargo xtask ext-e2e --download
      - name: Keep the driver and daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ext-e2e-logs-${{ github.run_attempt }}
          path: |
            target/ext-e2e/*/driver.log
            target/ext-e2e/*/data/logs/
          if-no-files-found: ignore

  # Windows 7 builds (roadmap D14), blocking: `cargo xtask win7` builds them with the app-local
  # DLLs, fails on an import from its denylist of DLLs and functions missing on Windows 7, then
  # starts them here, where Windows Server 2025 must keep loading its own combase.dll and API sets.
  # Then the Velopack package of the flavor as the release makes it (release.yml, flavors
  # win7-x64 and win7-x86), unsigned and not published, and its contents through the same gate.
  win7:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/win7/${{ matrix.arch }}
      FLAVOR: win7-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains (rust-toolchain.toml for xtask, pinned nightly for Win7)
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: win7-${{ matrix.arch }}
      - name: Build, check imports, start
        shell: bash
        run: |
          { echo '## Windows 7 ${{ matrix.arch }}'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo xtask win7 --arch ${{ matrix.arch }} | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: win7-${{ matrix.arch }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Velopack package (as release.yml, unsigned, without the icon)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          mkdir pack
          cp "$BIN/openncalayer.exe" "$BIN/nmhost.exe" "$BIN/combase.dll" \
            "$BIN/api-ms-win-core-winrt-error-l1-1-0.dll" README.md README.en.md LICENSE NOTICE pack/
          vpk --skip-updates pack --packId OpenNCALayer --packVersion "$version" \
            --packTitle OpenNCALayer --packAuthors "OpenNCALayer contributors" \
            --packDir pack --mainExe openncalayer.exe --channel "$FLAVOR" \
            --runtime win-${{ matrix.arch }} --outputDir packages --noInst
          ls -l packages
          echo "PACKAGE=packages/OpenNCALayer-$version-$FLAVOR-full.nupkg" >> "$GITHUB_ENV"
      # The same step as release.yml's.
      - name: Windows 7 package through the import gate
        shell: bash
        run: |
          package="$PACKAGE"
          7z x "$package" -owin7-package > /dev/null
          app=win7-package/lib/app
          for file in openncalayer.exe nmhost.exe combase.dll api-ms-win-core-winrt-error-l1-1-0.dll Squirrel.exe; do
            if [ ! -f "$app/$file" ]; then
              echo "::error::$file is not in $package"
              ls -l "$app"
              exit 1
            fi
          done
          mapfile -t exes < <(find "$app" -maxdepth 1 -iname '*.exe')
          cargo xtask check-imports "${exes[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: win7-${{ matrix.arch }}-package
          path: packages/*
          if-no-files-found: warn
      # A red gate or start keeps what it judged, for `dumpbin`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: win7-${{ matrix.arch }}-failed-${{ github.run_attempt }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: ignore

  # The macOS Velopack package as the release makes it (release.yml, flavor osx): both
  # architectures joined by lipo, packed by the pinned vpk with runtime osx-arm64 (a label
  # only, see release.yml); the packed binaries must stay universal. Nothing is published.
  macos-universal:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/universal-apple-darwin/release
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build both slices and join them
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p openncalayer -p oncl-nmhost
          done
          mkdir -p "$BIN"
          for exe in openncalayer nmhost; do
            lipo -create -output "$BIN/$exe" \
              "target/x86_64-apple-darwin/release/$exe" "target/aarch64-apple-darwin/release/$exe"
            archs="$(lipo -archs "$BIN/$exe")"
            echo "$exe: $archs"
            # Each architecture on its own: in " x86_64 arm64 " the two names share a space.
            for arch in x86_64 arm64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "::error::$exe is not universal: $archs"; exit 1 ;;
              esac
            done
          done
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Velopack package (as release.yml, unsigned)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          mkdir pack
          cp "$BIN/openncalayer" "$BIN/nmhost" README.md README.en.md LICENSE NOTICE pack/
          vpk --skip-updates pack --packId OpenNCALayer --packVersion "$version" \
            --packTitle OpenNCALayer --packAuthors "OpenNCALayer contributors" \
            --packDir pack --mainExe openncalayer --channel osx --runtime osx-arm64 \
            --outputDir packages --noInst
          ls -l packages
          package="packages/OpenNCALayer-$version-osx-full.nupkg"
          mkdir unpacked
          unzip -q "$package" -d unpacked
          grep -o '<machineArchitecture>[^<]*</machineArchitecture>' unpacked/*.nuspec || true
          # The packed binaries are both slices, not one; both must be in the package.
          found=0
          for name in openncalayer nmhost; do
            if [ -z "$(find unpacked -type f -name "$name")" ]; then
              echo "::error::$name is not in $package"
              find unpacked -type f
              exit 1
            fi
          done
          while IFS= read -r exe; do
            found=$((found + 1))
            archs="$(lipo -archs "$exe")"
            echo "$exe: $archs"
            for arch in x86_64 arm64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "::error::$exe in the package is not universal: $archs"; exit 1 ;;
              esac
            done
          done < <(find unpacked -type f \( -name openncalayer -o -name nmhost \))
          echo "$found binaries in the package checked"
          [ "$found" -ge 2 ]
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-universal-package
          path: packages/*
          if-no-files-found: warn

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch fixtures
        run: cargo xtask fetch-fixtures
      - name: Live tests
        run: cargo test --workspace --all-features -- --ignored live_
      # Docker comes with the runner image. Runs even if a live test failed: it does not
      # depend on them.
      - name: NCANode interop (XMLDSig, CMS)
        if: ${{ !cancelled() }}
        run: cargo xtask interop-ncanode
