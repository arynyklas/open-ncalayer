name: CI

on:
  push:
  pull_request:
  # Only the `live` job (real NCA services) runs on these two triggers.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path crates/oncl-pdk/example/Cargo.toml --check
      - run: cargo fmt --manifest-path plugins/Cargo.toml --all --check

  clippy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy of the example plugin (wasm32)
        run: cargo clippy --locked --manifest-path crates/oncl-pdk/example/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the guest SDK (wasm32)
        run: cargo clippy --locked -p oncl-pdk --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the built-in modules (wasm32)
        run: cargo clippy --locked -p oncl-builtin-accessory -p oncl-builtin-basics -p oncl-builtin-commonutils --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the plugin ports (wasm32)
        run: cargo clippy --locked --manifest-path plugins/Cargo.toml --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Tests of the ports' shared libraries
        run: cargo test --locked --manifest-path plugins/Cargo.toml -p oncl-port-kit -p oncl-port-pki

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Line tables keep file:line in backtraces; full debug info makes linking the test
      # binaries (above all on Windows) and the cache much slower.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every platform's packages: the licences test (`committed_licenses_are_fresh`) reads
      # their licence files offline. Its result does not depend on the host, so it runs on
      # Linux alone, where the fetch takes seconds (close to a minute on Windows).
      - name: Fetch packages
        if: runner.os == 'Linux'
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path plugins/Cargo.toml
      - name: Test
        shell: bash
        run: |
          skip=()
          if [ "$RUNNER_OS" != Linux ]; then
            skip=(--skip committed_licenses_are_fresh --skip committed_plugin_licenses_are_fresh)
          fi
          cargo xtask fetch-fixtures
          # The built-in modules' benchmarks (`bench_*`) are measured in release, by hand.
          cargo test --workspace --all-features -- --include-ignored --skip live_ --skip zola_ --skip bench_ "${skip[@]}"
      # The built-in modules' tests on their native code too, while a module has any (the
      # tests of the modules without native code left out).
      - name: Built-in modules, native backend
        env:
          ONCL_BUILTIN_BACKEND: native
        run: >-
          cargo test --locked -p oncl-builtin-tests --all-features --lib
          --test applet --test applet_tokens
      # The daemon as releases build it (no `e2e-prompter`, no `token-emulator`): the token
      # emulator's variable changes nothing.
      - name: Daemon without the test features
        if: runner.os == 'Linux'
        run: cargo test -p openncalayer --lib release_build_ignores_emulator_var
      # The `clippy` job runs on Linux and never sees `cfg(windows)` code (oncl-ui foreground).
      - name: Clippy (Windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The app-local DLLs of the Windows 7 builds are workspace members; on Windows their
      # tests build them.
      - name: Build the Windows 7 app-local DLLs
        if: runner.os != 'Windows'
        run: cargo build -p oncl-win7shim-combase -p oncl-win7shim-winrt-error
      - name: CMS interop with OpenSSL
        if: runner.os == 'Linux'
        run: cargo xtask interop-openssl

  # The built-in modules' limits in a 32-bit process, where their memory is smallest.
  builtins-x86:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Limits
        run: cargo test --locked --target i686-pc-windows-msvc -p oncl-builtin-tests --test limits

  # The real PC/SC backend (libpcsclite opened at run time) against an emulated Kaztoken:
  # pcscd with vsmartcard's virtual reader (a CI tool only: not linked, not shipped), the
  # card served by `cargo xtask token-emu`.
  tokens-vpcd:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pcscd and vpcd
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y pcscd vsmartcard-vpcd; then
            echo "::error::pcscd or vsmartcard-vpcd is not installable on this runner image"
            exit 1
          fi
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: |
          cargo build -p xtask
          cargo test --no-run -p oncl-token --features emulator --test vpcd
      - name: Test against the emulated Kaztoken
        run: |
          # The packaged pcscd is socket-activated and exits when idle (--auto-exit): stop
          # it and run one for the whole step (the polkit check is for desktop sessions),
          # then serve the card to its vpcd reader. The tests wait for the card to appear;
          # one at a time, as they share the card.
          sudo systemctl stop pcscd.socket pcscd.service 2>/dev/null || true
          # The log belongs to the runner user, not root: the redirect is meant.
          # shellcheck disable=SC2024
          sudo pcscd --foreground --disable-polkit > pcscd.log 2>&1 &
          cargo xtask token-emu --config crates/oncl-token/tests/vpcd-kaztoken.toml \
            > token-emu.log 2>&1 &
          status=0
          ONCL_TOKEN_VPCD=1 cargo test -p oncl-token --features emulator --test vpcd \
            -- --test-threads=1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- pcscd"; cat pcscd.log
            echo "--- token-emu"; cat token-emu.log
          fi
          exit "$status"

  deny:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The plugin ports' own lock file, under the core's rules.
      - name: cargo deny of the plugin ports
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: plugins/Cargo.toml
          arguments: --all-features --config deny.toml

  # The project site (`site/`): built with the pinned Zola from the committed ports and the
  # fixtures, and checked offline. Publishing is `pages.yml`'s.
  site:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The `zola_` tests (ignored, they download Zola) run here, not in `test`.
      - run: cargo xtask registry build
      - run: cargo test -p xtask --test registry_site -- --ignored zola_

  extension:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Only whether the AMO secrets exist: the secrets themselves reach the signing step alone.
      AMO_SIGNING: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A glob, not the directory: since Node 21 `--test` arguments are patterns.
      - run: node --test "extension/test/*.test.mjs"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask ext build
      # Unlisted AMO signing (roadmap D6). Skipped without the secrets; release tags (`v*`)
      # only, because AMO refuses a version it has already signed.
      - name: Sign the Firefox add-on (AMO, unlisted)
        if: env.AMO_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          npx --yes web-ext@10.8.0 sign --channel unlisted
          --source-dir target/extension/firefox --artifacts-dir target/extension/signed
      - name: Keep the signed add-on
        if: env.AMO_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: openncalayer-firefox-signed
          path: target/extension/signed/*.xpi
          if-no-files-found: error

  # The extension in Chrome for Testing, Firefox and Firefox ESR 115, over native messaging to
  # the daemon.
  ext-e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # libdbus-glib-1-2: Firefox ESR 115 links libdbus-glib-1.so.2 (later Firefox does not).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl libdbus-glib-1-2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p openncalayer --features e2e-prompter -p oncl-nmhost
      - run: cargo xtask ext build
      - run: cargo xtask ext-e2e --download
      - name: Keep the driver and daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ext-e2e-logs-${{ github.run_attempt }}
          path: |
            target/ext-e2e/*/driver.log
            target/ext-e2e/*/data/logs/
          if-no-files-found: ignore

  # Windows 7 builds (roadmap D14), blocking: `cargo xtask win7` builds them with the app-local
  # DLLs, fails on an import from its denylist of DLLs and functions missing on Windows 7, then
  # starts them here, where Windows Server 2025 must keep loading its own combase.dll and API sets.
  # Then the installer and the update package of the flavor as the release makes them
  # (`cargo xtask package windows`, flavors win7-x64 and win7-x86), unsigned and not published:
  # the package's contents and Setup.exe through the same gate.
  win7:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/win7/${{ matrix.arch }}
      FLAVOR: win7-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains (rust-toolchain.toml for xtask, pinned nightly for Win7)
        shell: bash
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
          # -Zbuild-std builds the standard library from rust-src, whose files cargo judges
          # by mtime like any path package. rustup dates them at installation, which would
          # make every cached build stale: a fixed date, older than any cache.
          src="$(rustup run nightly-2026-08-12 rustc --print sysroot)/lib/rustlib/src"
          find "$src" -exec touch -d 2026-08-12T00:00:00Z {} +
      - uses: ./.github/actions/pinned-toolchains
        with:
          keep: nightly-2026-08-12
      # Only xtask's own build and the registry: the Windows 7 build has a cache of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: win7-${{ matrix.arch }}-xtask
      # The build's own target directory, cached whole and outside `target/`: rust-cache keeps
      # only the packages `cargo metadata` lists, drops the standard library of -Zbuild-std,
      # and then every crate rebuilds. The workspace crates rebuild anyway (a fresh checkout
      # dates their files now), so the key changes only with what the dependencies build from.
      - name: Cache the Windows 7 build
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/win7-target
          key: win7-target-${{ matrix.arch }}-nightly-2026-08-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', 'xtask/src/win7.rs') }}
          restore-keys: win7-target-${{ matrix.arch }}-nightly-2026-08-12-
      - name: Build, check imports, start
        shell: bash
        run: |
          { echo '## Windows 7 ${{ matrix.arch }}'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo xtask win7 --arch ${{ matrix.arch }} --target-dir "$RUNNER_TEMP/win7-target" \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "${{ env.BIN }}/openncalayer.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win7-${{ matrix.arch }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package windows --flavor "$FLAVOR" --bin "$BIN" --version "$version" \
            --packages packages --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: win7-${{ matrix.arch }}-package
          path: packaged/*
          if-no-files-found: warn
      # A red gate or start keeps what it judged, for `dumpbin`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: win7-${{ matrix.arch }}-failed-${{ github.run_attempt }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: ignore

  # The Windows 10/11 installers and update packages as the release makes them (release.yml,
  # flavors win-x64 and win-x86, `cargo xtask package windows`), unsigned and not published:
  # the programs and Setup.exe must not need the Visual C++ Redistributable, which a clean
  # Windows does not have (the workspace links the CRT statically, .cargo/config.toml).
  windows-package:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            flavor: win-x64
          - target: i686-pc-windows-msvc
            flavor: win-x86
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-package-${{ matrix.target }}
      # Built once and embedded as release.yml does (`ONCL_BUILTINS_DIR`).
      - name: Built-in modules (as release.yml)
        run: cargo xtask builtins build
      - name: Build (as release.yml)
        env:
          ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
        run: cargo build --locked --release --target ${{ matrix.target }} -p openncalayer -p oncl-nmhost
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "${{ env.BIN }}/openncalayer.exe"
      - name: Start
        shell: bash
        run: |
          "$BIN/openncalayer.exe" --version
          # The relay exits 1 without its config; a program the loader cannot start exits
          # with STATUS_DLL_NOT_FOUND instead.
          status=0
          "$BIN/nmhost.exe" < /dev/null || status=$?
          test "$status" -eq 1
      - name: Daemon without the test features
        shell: bash
        run: |
          # The release build has no `e2e` subcommand: clap refuses it (exit code 2).
          status=0
          "$BIN/openncalayer.exe" e2e install-plugin x || status=$?
          test "$status" -eq 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package windows --flavor ${{ matrix.flavor }} --bin "$BIN" --version "$version" \
            --packages packages --dist packaged

  # The macOS installer and update package as the release makes them (release.yml, flavor
  # osx, `cargo xtask package macos`): both architectures joined by lipo, packed by the pinned
  # vpk, the update package, the .app and the .pkg checked for both slices and for hosts
  # x86_64 and arm64. Unsigned, nothing is published.
  macos-universal:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/universal-apple-darwin/release
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Built-in modules (as release.yml)
        run: cargo xtask builtins build
      - name: Build both slices and join them
        env:
          ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p openncalayer -p oncl-nmhost
          done
          mkdir -p "$BIN"
          for exe in openncalayer nmhost; do
            lipo -create -output "$BIN/$exe" \
              "target/x86_64-apple-darwin/release/$exe" "target/aarch64-apple-darwin/release/$exe"
          done
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "$BIN/openncalayer"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package macos --bin "$BIN" --version "$version" --packages packages \
            --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-universal-package
          path: packaged/*
          if-no-files-found: warn

  # The Linux AppImage as the release makes it (release.yml, flavor linux-x64): the programs
  # and the AppDir built and started in the pinned glibc 2.28 container, the AppImage packed
  # by the pinned vpk, unpacked, checked against glibc 2.28 and started in the container again.
  # Nothing is published.
  linux-appimage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install squashfs-tools (vpk's AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: AppImage and update package (as release.yml)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package linux-build --version "$version"
          cargo xtask builtins check --bin target/linux-x64/openncalayer
          cargo xtask package linux --version "$version" --packages packages --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-appimage
          path: packaged/*
          if-no-files-found: warn

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch fixtures
        run: cargo xtask fetch-fixtures
      - name: Live tests
        run: cargo test --workspace --all-features -- --ignored live_
      # Docker comes with the runner image. Runs even if a live test failed: it does not
      # depend on them.
      - name: NCANode interop (XMLDSig, CMS)
        if: ${{ !cancelled() }}
        run: cargo xtask interop-ncanode

  actionlint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # shellcheck comes with the runner image; actionlint runs it over the `run:` scripts.
      - name: actionlint
        run: |
          curl -sSfLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml
