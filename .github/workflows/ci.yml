name: CI

on:
  push:
  pull_request:
  # Only the `live` job (real NCA services) runs on these two triggers.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        run: cargo xtask fetch-fixtures && cargo test --workspace --all-features -- --include-ignored --skip live_
      # The `clippy` job runs on Linux and never sees `cfg(windows)` code (oncl-ui foreground).
      - name: Clippy (Windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: CMS interop with OpenSSL
        if: runner.os == 'Linux'
        run: cargo xtask interop-openssl

  deny:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  extension:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A glob, not the directory: since Node 21 `--test` arguments are patterns.
      - run: node --test "extension/test/*.test.mjs"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ext build

  # The extension in Chrome for Testing and Firefox, over native messaging to the daemon.
  ext-e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p openncalayer --features e2e-prompter -p oncl-nmhost
      - run: cargo xtask ext build
      - run: cargo xtask ext-e2e --download
      - name: Keep the driver and daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ext-e2e-logs-${{ github.run_attempt }}
          path: |
            target/ext-e2e/*/driver.log
            target/ext-e2e/*/data/logs/
          if-no-files-found: ignore

  # Windows 7 lane (roadmap D14). Non-blocking in P1: a red import gate records the starting
  # point for P6 and does not fail the workflow.
  win7-canary:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains (rust-toolchain.toml for xtask, pinned nightly for Win7)
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          # The job is expected to fail in P1; still keep the build cache.
          cache-on-failure: true
      - name: Build for Windows 7
        # bash: pwsh splits the unquoted `-Zbuild-std=std,panic_abort` at the comma.
        # The pinned nightly is 1.99.0-nightly, below the workspace rust-version 1.99.1.
        shell: bash
        run: cargo +nightly-2026-08-12 build -Zbuild-std=std,panic_abort --target x86_64-win7-windows-msvc --release --ignore-rust-version -p openncalayer
      - name: Check imports
        shell: bash
        run: |
          { echo '## Win7 import gate'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo -q xtask check-imports target/x86_64-win7-windows-msvc/release/openncalayer.exe | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fetch fixtures
        run: cargo xtask fetch-fixtures
      - name: Live tests
        run: cargo test --workspace --all-features -- --ignored live_
