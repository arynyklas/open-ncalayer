[alias]
xtask = "run -p xtask --"

# The static CRT on Windows: a clean Windows 10 or 11 has no Visual C++ Redistributable, and
# a program importing `VCRUNTIME140.dll` does not start there. The Windows 7 builds set the
# same flag themselves (`cargo xtask win7`). An explicit RUSTFLAGS replaces these flags.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
