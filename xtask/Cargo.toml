[package]
name = "xtask"
description = "OpenNCALayer development tasks (`cargo xtask …`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oncl-gost.workspace = true
oncl-ipc.workspace = true
# `plugin pack`: the core version each host function a plugin imports appeared in.
oncl-pdk.workspace = true
oncl-pki = { workspace = true, features = ["testing"] }
# `plugin pack` and `index add-plugin`: the package format and the ABI check the daemon uses.
oncl-plugin.workspace = true
oncl-protocol.workspace = true
oncl-testkit.workspace = true
# `token-emu`: an emulated token served to vpcd (the PC/SC test of CI).
oncl-token = { workspace = true, features = ["emulator"] }
oncl-update.workspace = true

anyhow.workspace = true
base64.workspace = true
clap.workspace = true
der.workspace = true
# `sign`: the update index key pair and signatures.
minisign.workspace = true
object.workspace = true
pkcs8.workspace = true
rand_chacha.workspace = true
rsa.workspace = true
# `sign`: passwords without echo.
rpassword.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
spki.workspace = true
# `ext-e2e`: the browsers' short TMPDIR.
tempfile.workspace = true
time.workspace = true
# `licenses`: the accepted licences of `deny.toml`.
toml.workspace = true
tungstenite.workspace = true
ureq.workspace = true
x509-cert.workspace = true
zip.workspace = true
# `sign`: passwords wiped after use.
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# `ext-e2e`: signal handling and killing process groups.
libc.workspace = true
