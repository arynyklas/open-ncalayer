[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/arynyklas/open-ncalayer"
publish = false

[workspace.dependencies]
oncl-basics = { path = "crates/oncl-basics" }
oncl-gost = { path = "crates/oncl-gost" }
oncl-ipc = { path = "crates/oncl-ipc" }
oncl-pki = { path = "crates/oncl-pki" }
oncl-protocol = { path = "crates/oncl-protocol" }
oncl-testkit = { path = "crates/oncl-testkit" }
oncl-tls = { path = "crates/oncl-tls" }
oncl-ui = { path = "crates/oncl-ui" }

aes = "0.9.0"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
clap = { version = "4.6.7", features = ["derive"] }
crypto-bigint = { version = "0.7.7", default-features = false, features = ["alloc", "zeroize"] }
der = { version = "0.8.2", features = ["alloc", "derive", "oid", "zeroize"] }
des = "0.9.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
gost94 = { version = "0.11.0", default-features = false }
hex-literal = "1.1.0"
hmac = "0.13.0"
httparse = "1.10.1"
libc = "0.2.191"
log = "0.4.34"
# Only in xtask (`check-imports`): PE reading only.
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "std"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
pkcs8 = { version = "0.11.0", features = ["alloc"] }
# Only in xtask (synthetic fixtures): `rsa` 0.9 and `rand_chacha` 0.3 share `rand_core` 0.6.
rand_chacha = "0.3.1"
rc2 = "0.9.0"
raw-window-handle = "0.6.2"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto", "zeroize"] }
rfd = "0.17.2"
ring = "0.17.14"
# XMLDSig: the XML tree with byte positions (the signature is spliced into the input bytes).
roxmltree = "0.21.2"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
# `~`: oncl-ui uses `unstable-winit-030`, which may change in a minor release.
slint = { version = "~1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
slint-build = "~1.18.1"
spki = { version = "0.8.1", features = ["alloc"] }
streebog = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
# `tracing-log`: messages of `log`-based crates (rfd, winit, rustls) reach the log files.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "tracing-log"] }
# Only in xtask (`ext-e2e`): the stand-in original NCALayer, a blocking WebSocket server.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
windows-sys = "0.61.2"
x509-cert = "0.3.0"
zeroize = "1.9.1"
# Only in xtask (`ext build`): the extension zip/xpi, deflate through pure-Rust zlib-rs.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# RSA key generation for `cargo xtask gen-fixtures` (also run by xtask tests) is very slow
# unoptimized.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
# GOST 34.11-2015 hashing of the 40 MiB document makes the openncalayer e2e test take over a
# minute and a half unoptimized, a few seconds optimized.
[profile.dev.package.streebog]
opt-level = 3
# GOST 34.10 operations (512-bit curves) take about 0.1 s each unoptimized; the PKIX, OCSP and
# CRL tests verify many signatures.
[profile.dev.package.oncl-gost]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
# The XMLDSig limit tests parse 50 MiB of XML; unoptimized parsing takes several seconds.
[profile.dev.package.roxmltree]
opt-level = 3
