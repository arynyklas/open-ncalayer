<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenNCALayer {{version}}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; color: #1b1b1b; }
  h1 { font-size: 1.5rem; }
  .ok { color: #1a7f37; }
  .fail { color: #c62828; }
  code { background: #f2f2f2; padding: 0 .25rem; }
</style>
</head>
<body>
<h1>OpenNCALayer {{version}}</h1>
<p class="ok">Сертификат сервера принят браузером: HTTPS-соединение с OpenNCALayer установлено.</p>
<p>Проверка WebSocket: <span id="ws">выполняется…</span></p>
<p>Сайты подключаются к <code>wss://127.0.0.1</code> на этом же порту, как к оригинальному NCALayer.</p>
<script>
(function () {
  var out = document.getElementById('ws');
  function done(ok, text) { out.textContent = text; out.className = ok ? 'ok' : 'fail'; }
  var ws;
  try {
    ws = new WebSocket('wss://' + location.host + '/');
  } catch (e) {
    done(false, 'ошибка: ' + e);
    return;
  }
  var greeted = false;
  ws.onmessage = function (event) {
    if (!greeted) {
      greeted = true;
      try {
        var version = JSON.parse(event.data).result.version;
        out.textContent = 'приветствие получено (версия протокола ' + version + '), heartbeat…';
      } catch (e) {
        done(false, 'неожиданное приветствие: ' + event.data);
        ws.close();
        return;
      }
      ws.send('--heartbeat--');
      return;
    }
    done(event.data === '--heartbeat--', event.data === '--heartbeat--'
      ? 'работает (приветствие и heartbeat получены)'
      : 'неожиданный ответ: ' + event.data);
    ws.close();
  };
  ws.onerror = function () { done(false, 'не удалось подключиться'); };
})();
</script>
</body>
</html>
