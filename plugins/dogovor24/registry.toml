vendor = "ТОО «Договор24»"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Окно выбора файла и пароля заменено общими окнами OpenNCALayer (по-прежнему до разбора метода); пользователь выбирает ключ (оригинал брал последний ключ файла)."

[[differences]]
ru = "Путь к ключу (настройка D24ModulePath) не хранится: плагину путь не сообщается, окно OpenNCALayer само заполняет последний путь. Значение по умолчанию «D24ModulePath» как путь к файлу не воспроизводится."

[[differences]]
ru = "signEsedo: messageDigest считается тем же алгоритмом, что digestAlgorithm (у оригинала для RSA — ГОСТ 34.311). Для ключей ГОСТ ответ тот же. Запрос OCSP ждёт не дольше 60 с."

[[differences]]
ru = "Сертификаты RSA-SHA1: все такие сертификаты НУЦ просрочены; подпись ими отвечает обычной ошибкой плагина с текстом ядра."
