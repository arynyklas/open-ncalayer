id = "io.github.arynyklas.openncalayer.port.efactoring"
modules = ["EFactoringSign"]

[original]
symname = "kz.efactoring.EfactoringSignBundle"
version = "1.2"
vendor = "ТОО «E-Commerce Center»"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Окно выбора ключа — общее окно OpenNCALayer; дерева хранилищ с запомненными контейнерами и последним ключом нет."

[[differences]]
ru = "Ключи на токенах — только при включённой экспериментальной поддержке токенов; без неё работают файлы PKCS#12."

[[differences]]
ru = "Пароль проверяет окно OpenNCALayer, поэтому ошибки «Неверный пароль» после выбора ключа не бывает."

[[differences]]
ru = "Окна показываются на языке OpenNCALayer: казахский — русскими текстами (у оригинала на казахской системе подпись обрывала соединение); иначе — по-русски или по-английски, как у оригинала."

[[differences]]
ru = "Загрузка документа по upload_url (binary, xml с source не local) не выполняется, как и у оригинала версии 1.2: после выбора ключа — окно «Ошибка при разборе запроса» с повтором или отменой, сетевых запросов нет."

[[differences]]
ru = "Подпись элемента (sign_element) содержит в Transforms преобразование enveloped-signature перед C14N с комментариями; оригинал указывал только C14N. Это намеренное исправление: подпись проверяется и тогда, когда элемент для подписи лежит внутри подписываемого."
