id = "io.github.arynyklas.openncalayer.port.efactoring"
version = "1.0.0-beta.4"
min_core = "0.1.0-alpha.7"
modules = ["EFactoringSign"]

[name]
ru = "EFactoringSign (порт OpenNCALayer)"
kk = "EFactoringSign (OpenNCALayer порты)"
en = "EFactoringSign (OpenNCALayer port)"

[description]
ru = "Подпись текста и XML для портала электронного факторинга, как модуль EFactoringSign"
kk = "Электрондық факторинг порталына мәтін мен XML қол қою, EFactoringSign модулі сияқты"
en = "Text and XML signatures for the e-factoring portal, as the EFactoringSign module made them"

[replaces]
symname = "kz.efactoring.EfactoringSignBundle"
version = "1.2"

[capabilities]
keys = true
dialogs = true

[[operations]]
name = "sign-text-attached-timestamp"
module = "EFactoringSign"
manual = true
request = '{"module":"EFactoringSign","type":"text","data":"{text}","attach":true,"has_timestamp":true}'
label = { ru = "Подписать текст (CMS): с меткой времени (данные внутри) (без окна повтора)", kk = "Мәтінге қол қою (CMS): уақыт белгісі бар (деректер ішінде) (қайталаусыз)", en = "Sign a text (CMS): time-stamped (attached) (no retry window)" }

[[operations.params]]
name = "text"
kind = "text"
max_chars = 65536

[operations.uses]
imports = ["keys_choose", "keys_release", "random", "keys_sign_cms_ex"]
network = "pki"

[[operations.uses.key]]
kind = "cms_ex"
content = "param:text"

[operations.uses.key.profile]
encapsulate = true
timestamp = "kalkan"

[[operations]]
name = "sign-text-attached"
module = "EFactoringSign"
manual = true
request = '{"module":"EFactoringSign","type":"text","data":"{text}","attach":true,"has_timestamp":false}'
label = { ru = "Подписать текст (CMS): данные внутри (без окна повтора)", kk = "Мәтінге қол қою (CMS): деректер ішінде (қайталаусыз)", en = "Sign a text (CMS): attached (no retry window)" }

[[operations.params]]
name = "text"
kind = "text"
max_chars = 65536

[operations.uses]
imports = ["keys_choose", "keys_release", "random", "keys_sign_cms_ex"]
network = "pki"

[[operations.uses.key]]
kind = "cms_ex"
content = "param:text"

[operations.uses.key.profile]
encapsulate = true

[[operations]]
name = "sign-text-detached-timestamp"
module = "EFactoringSign"
manual = true
request = '{"module":"EFactoringSign","type":"text","data":"{text}","attach":false,"has_timestamp":true}'
label = { ru = "Подписать текст (CMS): с меткой времени (отсоединённая) (без окна повтора)", kk = "Мәтінге қол қою (CMS): уақыт белгісі бар (бөлек) (қайталаусыз)", en = "Sign a text (CMS): time-stamped (detached) (no retry window)" }

[[operations.params]]
name = "text"
kind = "text"
max_chars = 65536

[operations.uses]
imports = ["keys_choose", "keys_release", "random", "keys_sign_cms_ex"]
network = "pki"

[[operations.uses.key]]
kind = "cms_ex"
content = "param:text"

[operations.uses.key.profile]
timestamp = "kalkan"

[[operations]]
name = "sign-text-detached"
module = "EFactoringSign"
manual = true
request = '{"module":"EFactoringSign","type":"text","data":"{text}","attach":false,"has_timestamp":false}'
label = { ru = "Подписать текст (CMS): отсоединённая подпись (без окна повтора)", kk = "Мәтінге қол қою (CMS): бөлек қолтаңба (қайталаусыз)", en = "Sign a text (CMS): detached (no retry window)" }

[[operations.params]]
name = "text"
kind = "text"
max_chars = 65536

[operations.uses]
imports = ["keys_choose", "keys_release", "random", "keys_sign_cms_ex"]
network = "pki"

[[operations.uses.key]]
kind = "cms_ex"
content = "param:text"

[[operations]]
name = "sign-xml"
module = "EFactoringSign"
manual = true
request = '{"module":"EFactoringSign","type":"xml","data":"{xml}"}'
label = { ru = "Подписать XML-документ целиком (без окна повтора)", kk = "XML құжатына тұтас қол қою (қайталаусыз)", en = "Sign a whole XML document (no retry window)" }

[[operations.params]]
name = "xml"
kind = "text"
max_chars = 65536

[operations.uses]
imports = ["keys_choose", "keys_release", "random", "keys_sign_xml_ex"]
network = "pki"

[[operations.uses.key]]
kind = "xml_ex"
content = "param:xml"

[operations.uses.key.profile]
placement = "document_element"
strip_whitespace = true
base64_line_breaks = false
output = { serialize = { declaration = false, standalone_no = false, trim = true } }

[[operations]]
name = "sign-xml-element"
module = "EFactoringSign"
manual = true
request = '{"module":"EFactoringSign","type":"xml","data":"{xml}","sign_element":"{element}","signature_parent_element":"{parent}"}'
label = { ru = "Подписать элемент XML (XPath) (без окна повтора)", kk = "XML элементіне қол қою (XPath) (қайталаусыз)", en = "Sign an XML element (XPath) (no retry window)" }

[[operations.params]]
name = "xml"
kind = "text"
max_chars = 65536

[[operations.params]]
name = "element"
kind = "text"
max_chars = 256

[[operations.params]]
name = "parent"
kind = "text"
max_chars = 256

[operations.uses]
imports = ["keys_choose", "keys_release", "random", "keys_sign_xml_ex"]
network = "pki"

[[operations.uses.key]]
kind = "xml_ex"
content = "param:xml"

[operations.uses.key.profile]
element = "param:element"
parent = "param:parent"
placement = "parent"
namespaces = [{ prefix = "SOAP-ENV", uri = "http://schemas.xmlsoap.org/soap/envelope/" }]
other_prefix_uri = "http://www.w3.org/2000/09/xmldsig#"
c14n = "exclusive"
strip_whitespace = true
base64_line_breaks = false
output = { serialize = { declaration = false, standalone_no = false, trim = true } }
transforms = ["enveloped", { c14n = "inclusive_with_comments" }]
