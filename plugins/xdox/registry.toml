id = "io.github.arynyklas.openncalayer.port.xdox"
modules = ["kz.xdox.signerbundle"]

[original]
symname = "kz.xdox.osgi.SignerBundle"
version = "1.1"
vendor = "ТОО Первое кредитное бюро"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Подпись ставится ключом, выбранным в окне. Оригинал подписывал первым ключом подписи хранилища в порядке HashMap и игнорировал выбор; различие видно только в хранилищах с несколькими ключами подписи."

[[differences]]
ru = "Цепочка сертификата проверяется по сертификатам УЦ ядра ещё в окне выбора ключа: ключ без цепочки недоступен для выбора, а не отвергается после него."

[[differences]]
ru = "Удостоверение личности (AKKZIDCardStore) — только при включённой экспериментальной поддержке токенов; без неё ответ «storage.empty»."

[[differences]]
ru = "Обрыв соединения при неполном запросе — без кадра закрытия (код 1006), а не 1011 оригинала."

[[differences]]
ru = "Любая отмена окна отвечает «Misplaced key.»: в OpenNCALayer выбор хранилища и ключа — одно окно, и отмены не различаются. Оригинал при закрытии окна выбора файла отвечал «action.canceled»."
