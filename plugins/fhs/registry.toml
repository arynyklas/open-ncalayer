id = "io.github.arynyklas.openncalayer.port.fhs"
modules = ["kz.fhs.cabinet.FHSCabinetSigner"]

[original]
symname = "kz.fhs.cabinet.FHSCabinet"
version = "2.0.0"
vendor = "First Heartland Securities"

[port]
status = "partial"
conformance = "confirmed"

[[differences]]
ru = "Ключ по пути от страницы (getCertificateInfo, signTextV2, signXmlV2) открывается после согласия пользователя в окне OpenNCALayer, один раз за сессию."

[[differences]]
ru = "signFile скачивает файл только с адреса того же сайта (https://*.fhs.kz) и с проверкой TLS; оригинал скачивал с любого адреса и отключал проверку TLS для всего NCALayer."

[[differences]]
ru = "certificateType и порядок полей certificateInfo повторяют записи оригинала: у сертификата физлица AUTHENTICATION раньше SIGNATURE, у сертификата с организацией (юрлица) SIGNATURE первым и иной порядок свойств в одной корзине HashMap. Причина различия у оригинала не выяснена: порт различает сертификаты по наличию организации в субъекте."

[[differences]]
ru = "Методы signXml, signFile и signText выбирают ключ в общем окне OpenNCALayer; списка загруженных ключей между вызовами нет. Хранилище облачной подписи (ABCloudServiceStore) не предлагается; токены — только при включённой экспериментальной поддержке токенов."

[[differences]]
ru = "Казахский язык OpenNCALayer показывает тексты Cabinet_kz (русские); оригинал на такой локали падал."

[[differences]]
ru = "Сертификаты RSA-SHA1: все такие сертификаты НУЦ просрочены; подпись ими отвечает обычной ошибкой плагина с текстом ядра."
