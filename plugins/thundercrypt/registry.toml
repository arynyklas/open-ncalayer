id = "io.github.arynyklas.openncalayer.port.thundercrypt"
modules = ["asia.dbt.thundercrypt.osgi.ThunderCryptModule"]

[original]
symname = "asia.dbt.thundercrypt.osgi.ThunderCryptModule"
version = "1.16.5"
vendor = "Dynamics Business Technologies"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Файл ключа по пути от страницы открывается после согласия пользователя в окне OpenNCALayer (один раз за сессию); пароль вводится в окне ядра и плагину не передаётся."

[[differences]]
ru = "Токены (keyType token) — только при включённой экспериментальной поддержке токенов; без неё ответ «Could not load key!»."

[[differences]]
ru = "Подписи с хешем GOST3411_GT и sha1RSA не создаются (SIGNING_FAILED). Ключи RSA не подписывают вовсе: хеш CertID в запросе OCSP выбирается по DN издателя издателя, у корневых УЦ RSA НУЦ в нём есть «(RSA)», и правило даёт GOST3411_GT, которого в OpenNCALayer нет — ответ SIGNING_FAILED."

[[differences]]
ru = "Поле detail в params собирается из сведений OpenNCALayer о сбое сети, а не из текстов исключений JDK."

[[differences]]
ru = "Нет паузы 200 мс между подписью и проверкой; после B-LTA архивная метка отдельно не проверяется."

[[differences]]
ru = "Запросы OCSP, TSP и CRL идут только к узлам PKI НУЦ (*.pki.gov.kz)."

[[differences]]
ru = "B-LT несёт меньше данных проверки, чем у оригинала: только цепочку подписанта, вложенный ответ OCSP и CRL подписанта. Оригинал добавлял также цепочки и свежие ответы OCSP (с переходом на CRL) для сертификата TSA метки подписи и промежуточных УЦ, а после архивной метки — данные её TSA."
