id = "io.github.arynyklas.openncalayer.port.metadoc"
modules = ["kz.metadoc.NCAModule"]

[original]
symname = "kz.metadoc.NCAModule"
version = "1.7"
vendor = "Metadoc"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Ключ по пути и паролю от страницы — только после разрешения пользователя (один раз за сессию); отказ — «action.cancelled»."

[[differences]]
ru = "getKeyInfo не возвращает поле path: путь к хранилищу ключей, выбранному в окне ядра, плагину не сообщается."

[[differences]]
ru = "Сертификаты, чей УЦ выпущен RSA-УЦ (идентификатор в запросе OCSP по ГОСТ 34.311 GT) или иным ГОСТ-УЦ, не подписываются: ответ «UNKNOWN_CAUSE»; ядро не строит такие запросы."

[[differences]]
ru = "Проверка расширенного назначения ключа (право подписи юрлица) не делает исключения для сертификатов УЦГО: УЦГО в ядре не поддерживается."

[[differences]]
ru = "Токен Kaztoken (keyType «token») — только при включённой экспериментальной поддержке токенов; без неё ответ «Could not load key!»."

[[differences]]
ru = "Метка времени запрашивается GET с адресом в процентной кодировке Base64; запрос длиннее 255 байт (недостижимый для этого модуля) уходит POST с типом протокола, а не application/ocsp-request."

[[differences]]
ru = "Обрыв соединения при неполном запросе — без кадра закрытия (код 1006), а не 1011 оригинала."

[[differences]]
ru = "Порядок ключей message/params в ответе с ошибкой адреса и тексты ошибок самопроверки, которых нет в таблице кодов, вычислены и не сверены с оригиналом."
