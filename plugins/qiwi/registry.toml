[port]
status = "partial"
conformance = "confirmed"

[[differences]]
ru = "Сессия 20 минут живёт только в текущем соединении и держит открытый ключ, а не путь и пароль (у оригинала — на весь процесс для всех сайтов)."

[[differences]]
ru = "Подписывает ключ, выбранный в окне (оригинал выбирал в окне ключ, но подписывал последним ключом файла)."

[[differences]]
ru = "Окна выбора файла и ключа — общие окна OpenNCALayer."

[[differences]]
ru = "Ключи на сертификатах sha1RSA не подписывают (OpenNCALayer не делает подписей RSA-SHA1): ответ 200 без signedXml, как у оригинала при сбое подписи. Ключ ГОСТ 2015 с адресами алгоритмов ГОСТ 2004 тоже не подписывает; оригинал такой ключ подписывает, но модуль не возвращает подписанный XML, и ответ страницы тот же."

[[differences]]
ru = "Окно ручных инструментов: объявлено операций — 2 (sign-xml-rsa, sign-xml-gost2004): по одной на алгоритм ключа, каждая применяет ключ один раз и запрашивает подтверждение. Модуль выбирает адреса алгоритмов по сертификату выбранного ключа; ключ другого алгоритма даёт вызов, которого операция не объявляет, и окно отклоняет его до применения ключа (options-mismatch). Ключ ГОСТ 2015 в окне не подписывает (модуль шлёт ему адреса ГОСТ 2004), ключ RSA-SHA1 тоже. Методы, не вошедшие в этот список (logOut), в окне не предлагаются."
