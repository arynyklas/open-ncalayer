id = "io.github.arynyklas.openncalayer.port.market"
modules = ["MarketSign"]

[original]
symname = "kz.ecc.MarketSignBundle"
version = "1.0.7"
vendor = "ТОО «E-Commerce Center»"

[port]
status = "partial"
conformance = "confirmed"

[[differences]]
ru = "Окно выбора ключа — общее окно OpenNCALayer; дерева хранилищ с запомненными контейнерами и последним ключом нет."

[[differences]]
ru = "Ключи на токенах — только при включённой экспериментальной поддержке токенов; без неё работают файлы PKCS#12."

[[differences]]
ru = "Пароль проверяет окно OpenNCALayer, поэтому ошибки «Неверный пароль» после выбора ключа не бывает."

[[differences]]
ru = "Окна показываются на языке OpenNCALayer: казахский — русскими текстами (у оригинала на казахской системе подпись обрывала соединение); иначе — по-русски или по-английски, как у оригинала."

[[differences]]
ru = "Окно ошибки — окно OpenNCALayer с теми же кнопками «Закрыть» (повтор) и «Отменить»."

[[differences]]
ru = "Запрос text, у которого data не строка (null или поля нет): оригинал не показывал окон и не отвечал, соединение молчало дальше; порт закрывает соединение, ничего не показав."

[[differences]]
ru = "Окно ручных инструментов: объявлено операций — 5 (sign-text-attached-timestamp, sign-text-attached, sign-text-detached-timestamp, sign-text-detached, sign-xml); каждая применяет ключ один раз и запрашивает подтверждение. Методы, не вошедшие в этот список, в окне не предлагаются."
