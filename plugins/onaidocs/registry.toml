id = "io.github.arynyklas.openncalayer.port.onaidocs"
modules = ["kz.onaidocs.SignBundle"]

[original]
symname = "onaidocs-sign-bundle"
version = "1.1.0"
vendor = "Onaidocs"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Сверка не закончена (conformance = computed): поведение выведено из кода бандла onaidocs-sign-bundle 1.1.0 (sha256 6549a74d4ed8474d330c00873672148eece08a139422a8c49e26643e5cfd190a), а работающий оригинал в лаборатории не запускался. Ответы, тексты ошибок и порядок проверок выведены из кода; на оригинале они не сверены. В канал stable порт не пускают, пока сверка не закончена."

[[differences]]
ru = "Окно выбора файла и пароля заменено общими окнами OpenNCALayer (по-прежнему до разбора метода, для любого запроса, в том числе с неизвестным методом): пользователь выбирает ключ (оригинал брал последний ключ файла PKCS#12 и обрезал пробелы в пароле). Отмена и закрытие окна, как у оригинала, дают ответ «Certificate container was not provided»."

[[differences]]
ru = "Предел ожидания окна не воспроизводится: оригинал ждал окно не дольше 120 с, потом отвечал «Certificate was not selected (timeout or dialog closed)» (окно оставалось открытым). Окно OpenNCALayer своего предела не имеет."

[[differences]]
ru = "Путь к ключу (настройка OnaidocsSignPath в java.util.prefs) не хранится: плагину путь не сообщается, окно OpenNCALayer само заполняет последний путь."

[[differences]]
ru = "signCMS не посылает запрос OCSP: оригинал посылал его (без предела ожидания), но ответ отбрасывал, на результат он не влиял. Запрос OCSP signEsedo ждёт не дольше 60 с; адрес из системного свойства knca.ocspresponderURL не читается, используется http://ocsp.pki.gov.kz."

[[differences]]
ru = "signEsedo: messageDigest считается тем же алгоритмом, что digestAlgorithm (у оригинала для RSA — ГОСТ 34.311, и такая подпись неверна). Для ключей ГОСТ ответ тот же. Подписи на SHA-1 (sha1RSA) порт не создаёт: все такие сертификаты НУЦ просрочены, подпись ими отвечает обычной ошибкой плагина с текстом ядра."

[[differences]]
ru = "Не проверено на оригинале: состав CMS. Порт кладёт в CMS только сертификат подписанта; оригинал строит цепочку и передаёт её в createCAdES, а входит ли вся цепочка в результат, решает код Kalkan вне бандла. Выбор «только подписант» выведен из порта dogovor24, у которого тот же код; сверен ли тот порт с оригиналом именно в этой части, здесь не проверялось. Метка времени: SHA-256, GET, политика 1.2.398.3.3.2.6.2 (TSA_RSA, выведено из значений ядра), а не проверено на оригинале."

[[differences]]
ru = "Сообщение о сбое метки времени: порт отвечает описанием сбоя от ядра (detail), а не текстом Kalkan. Тексты других ошибок (JSON, base64, ключ) выведены из кода оригинала, включая «JSONArray[0] not a string.» старого org.json бандла."

[[differences]]
ru = "Окно ручных инструментов: операций не объявлено, порт показан там строкой «нет операций». Единственный пригодный для окна метод — signCMS; операцию sign-cms, как у dogovor24, можно объявить после сверки с оригиналом. batchSignCMS и signEsedo в окне невозможны (несколько подписей за вызов и профиль ESEDO)."
