[[differences]]
ru = "Одноразовые токены chain/newChain действуют только в текущем соединении и держат открытый ключ, а не пароль (у оригинала — общий кэш на процесс с паролем для всех сайтов); в соединении хранится не больше 12 токенов (OpenNCALayer держит не больше 16 ключей на соединение), старейший вытесняется."

[[differences]]
ru = "Выбор файла хранилища и окно подписи заменены общими окнами OpenNCALayer; ключи фильтруются по типу Kalkan (keyType) тем же правилом."

[[differences]]
ru = "Ключи на токенах — только при включённой экспериментальной поддержке токенов; без неё токен отвечает storage.empty."
