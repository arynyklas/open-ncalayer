id = "io.github.arynyklas.openncalayer.port.arta"
modules = ["kz.arta.synergy.signmodule"]

[original]
symname = "kz.arta.synergy.signmodule"
version = "6.0"
vendor = "Arta Software"

[port]
status = "partial"
conformance = "confirmed"

[[differences]]
ru = "Ключ, выбранный в getKeyInfo/getFullKeyInfo, хранится только в этом соединении (сессии) и пароль модулю неизвестен. Оригинал хранил ключ с паролем на весь процесс, и любая страница могла подписать им без окна."

[[differences]]
ru = "signXML для ключей ГОСТ 2015 подписывает алгоритмом ключа (URI Kalkan). Оригинал указывал URI ГОСТ 34.310-2004 для любого ключа, кроме RSA, и ключом ГОСТ 2015 XML не подписывал: результат null (на запрос с uuid — {\"code\":\"500\"} без message, без uuid — обрыв соединения)."

[[differences]]
ru = "Ключи sha1RSA не подписывают (ядро не делает подписей SHA-1): signXML отвечает null, ЕСЭДО-подпись — ошибкой."

[[differences]]
ru = "Чтение файла, названного страницей, и запись .cms рядом с ним — только после разрешения пользователя (один раз за сессию)."

[[differences]]
ru = "Токены — только при включённой экспериментальной поддержке токенов; без неё ответ «storage.empty»."

[[differences]]
ru = "Значение атрибута 1.3.6.1.4.1.6801.2.8 (DN подписанта) и форма ответа OCSP в ЕСЭДО-подписи вычислены по правилам Kalkan: оригинал в лаборатории ЕСЭДО-подпись не построил (его запросы OCSP и TSA не получили ответа), сверить их было не с чем."

[[differences]]
ru = "signXML без ключа без uuid обрывает соединение без кадра закрытия (код 1006), а не 1011 оригинала."

[[differences]]
ru = "signFilePath сначала проверяет выбранный ключ, затем читает файл: без ключа ответ EXCEPTION даже для отсутствующего файла. Оригинал в этом случае отвечал file.ioException."
