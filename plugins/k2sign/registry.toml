id = "io.github.arynyklas.openncalayer.port.k2sign"
modules = ["K2Sign"]

[original]
symname = "kz.ecc.K2SignBundle"
version = "1.1.5"
vendor = "АО «Центр электронных финансов»"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Окно выбора ключа — общее окно OpenNCALayer; списка недавних сертификатов плагина нет, ключи use_first_certificate и cert_pass не поддерживаются."

[[differences]]
ru = "Ключи на токенах — только при включённой экспериментальной поддержке токенов; без неё работают файлы PKCS#12."

[[differences]]
ru = "Все запросы — только к сайту страницы (относительные адреса разрешаются от его origin); абсолютный адрес другого сайта отклоняется (DOWNLOAD_FILE_EXCEPTION или UPLOAD_FILE_EXCEPTION), оригинал ходил куда угодно. Плагин работает только для страниц сайтов «Казначейство-Клиент» из манифеста."

[[differences]]
ru = "Файл настроек ~/.NURSign/config/k2sign.properties не читается: предельный размер файла — 20 МиБ; прокси, NTLM и учётные данные — настройки ядра."

[[differences]]
ru = "Окна хода передачи с кнопкой отмены нет: передачи ограничены таймаутом ядра (60 с); перенаправления не выполняются."

[[differences]]
ru = "Временные zip-файлы не создаются на диске: архив собирается в памяти, имя в запросе — как у оригинала (<основа><число>_Signed.zip)."

[[differences]]
ru = "Подписи проверяются ядром (первый подписант, сертификат с digitalSignature и nonRepudiation, срок действия на signingTime, без цепочки и отзыва), как у оригинала."
