id = "io.github.arynyklas.openncalayer.port.ezsigner"
modules = ["kz.gov.pki.cms.CMSSignUtil"]

[original]
symname = "kz.gov.pki.cms.NLDocSignerModule"
version = "1.2.2"
vendor = "ezsigner.kz"

[port]
status = "partial"
conformance = "computed"

[[differences]]
ru = "Переносятся методы версий 1.2.1 и 1.2.2 (их код сверен побайтно, см. ниже); методы версии 1.1 (подписание по ссылке, текста, просмотр CMS, HTML-редактор, открытие файла в ОС) отвечают «нет такого метода», подписание ссылок в оригинале 1.2.x отключено."

[[differences]]
ru = "Окна хранилища и списка ключей — одно общее окно OpenNCALayer; его закрытие отвечает «Не удалось открыть хранилище» и при отмене выбора ключа."

[[differences]]
ru = "Сертификат проверяется по сертификатам УЦ ядра (НУЦ РК), а не по встроенному списку оригинала с тестовыми УЦ."

[[differences]]
ru = "Чтение файла и запись подписи спрашивают разрешение пользователя (один раз за сессию); правило «только локальные диски» — правила путей ядра, отсутствующая папка обнаруживается при записи."

[[differences]]
ru = "Язык сообщений хранится в сессии плагина, а не во всём процессе."

[[differences]]
ru = "Файл читается (с окном разрешения) до проверки пустого storageName; оригинал отвечал 404 сразу, без окна."

[[differences]]
ru = "Версия 1.2.2 добавила только поддержку macOS: класс проверки локального пути разделён на реализации для Windows и POSIX, код CMS, подписи и выбора файлов не изменился (API и байткод совпадают с 1.2.1, Windows-проверка отличается только именами). Сверка с работающим оригиналом 1.2.2 не повторялась: результат сверки 1.2.1 перенесён по совпадению кода."
